# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Runs on the 1st and 15th of each month
  schedule:
    - cron: '0 0 1,15 * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build and deploy job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Create API endpoint from upcoming.yaml
        run: |
          # Install PyYAML for reading upcoming.yaml
          pip3 install pyyaml
          
          # Create the API directory
          mkdir -p public/api
          
          # Get the current game ID from upcoming.yaml
          CURRENT_GAME_ID=$(python3 scripts/get_current_week_game_id.py)
          
          # Create the API endpoint file
          if [ $? -eq 0 ] && [ -n "$CURRENT_GAME_ID" ]; then
            echo "$CURRENT_GAME_ID" > public/api/current-game
            echo "✅ Created public/api/current-game with ID: $CURRENT_GAME_ID"
          else
            echo "no-game" > public/api/current-game
            echo "⚠️  No current game found, created placeholder"
          fi

          python3 scripts/generate_upcoming_games.py
          python3 scripts/generate_history.py


