<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - BonjourArcade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000 !important;
            overflow: hidden;
            position: relative;
            color: #fff;
        }
        
        /* Ensure 404 text is always visible */
        #errorOverlay {
            display: flex !important;
        }
        
        /* Ensure buttons are always visible */
        #actionButtons {
            display: flex !important;
        }

        /* Redirect overlay - reuses loading.js classes */
        .redirect-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            display: none;
            background-color: var(--background, #000);
            justify-content: center;
            align-items: center;
        }

        .redirect-overlay.active {
            display: flex;
        }
        
        /* Prevent loading.js overlay from showing on 404 page */
        #loading-overlay:not(#redirectOverlay) {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
        
        /* Ensure redirect overlay uses loading.js styles when active */
        #redirectOverlay.active {
            background-color: var(--background, #000);
        }

        /* Game covers container */
        .covers-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        /* Cover column */
        .cover-column {
            position: absolute;
            top: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            will-change: transform;
            /* Ensure columns don't have gaps */
            box-sizing: border-box;
        }

        .cover-item {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 4px;
            opacity: 0.3;
            transition: opacity 0.3s, transform 0.2s;
            position: relative;
        }

        .cover-item-wrapper {
            cursor: pointer;
        }

        .cover-item-wrapper:hover .cover-item {
            opacity: 0.8;
            transform: scale(1.05);
        }

        .cover-item-wrapper:active .cover-item {
            transform: scale(0.95);
        }

        /* Tooltip for game title */
        .cover-item-wrapper {
            position: relative;
        }

        .cover-tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
            margin-bottom: 5px;
            border: 1px solid #fffd37;
            box-shadow: 0 0 10px rgba(255, 253, 55, 0.5);
            font-family: 'Courier New', monospace;
        }

        .cover-item-wrapper:hover .cover-tooltip {
            opacity: 1;
        }

        .cover-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: rgba(0, 0, 0, 0.9);
        }

        /* 404 Overlay */
        .error-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: none;
        }

        .error-text {
            font-size: 20vw;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            color: transparent;
            -webkit-text-stroke: 3px rgba(255, 0, 87, 0.9);
            text-stroke: 3px rgba(255, 0, 87, 0.9);
            text-shadow: 
                0 0 15px rgba(255, 0, 87, 0.5),
                0 0 30px rgba(255, 0, 87, 0.3);
            letter-spacing: 0.1em;
            text-align: center;
            line-height: 1;
            /* Subtle, slow pulse instead of aggressive flashing */
            animation: subtleGlow 4s ease-in-out infinite;
        }

        @keyframes subtleGlow {
            0%, 100% {
                -webkit-text-stroke-color: rgba(255, 0, 87, 0.85);
                text-stroke-color: rgba(255, 0, 87, 0.85);
                text-shadow: 
                    0 0 15px rgba(255, 0, 87, 0.4),
                    0 0 30px rgba(255, 0, 87, 0.2);
            }
            50% {
                -webkit-text-stroke-color: rgba(255, 0, 87, 0.95);
                text-stroke-color: rgba(255, 0, 87, 0.95);
                text-shadow: 
                    0 0 20px rgba(255, 0, 87, 0.6),
                    0 0 40px rgba(255, 0, 87, 0.3);
            }
        }

        /* Action buttons */
        .action-buttons {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 200;
            pointer-events: auto;
        }

        .arcade-btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            border: 3px solid #fffd37;
            background: linear-gradient(135deg, #ff0057 0%, #a259ff 100%);
            color: #fff;
            cursor: pointer;
            border-radius: 8px;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: 
                0 0 20px rgba(255, 0, 87, 0.5),
                0 4px 10px rgba(0, 0, 0, 0.3);
            text-decoration: none;
            display: inline-block;
            pointer-events: auto;
        }

        .arcade-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 
                0 0 30px rgba(255, 0, 87, 0.8),
                0 6px 15px rgba(0, 0, 0, 0.4);
            border-color: #00ff90;
        }

        /* Loading screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .loading-screen.hidden {
            display: none;
        }

        .loading-message {
            font-size: 1.5rem;
            color: #00ff90;
            font-family: 'Courier New', monospace;
            margin-bottom: 20px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .error-text {
                font-size: 25vw;
                -webkit-text-stroke-width: 2px;
                text-stroke-width: 2px;
            }
            .arcade-btn {
                font-size: 1rem;
                padding: 12px 24px;
            }
            .action-buttons {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Redirect overlay - reuses loading-overlay from loading.js -->
    <div class="redirect-overlay" id="redirectOverlay"></div>
    
    <!-- Prevent loading.js from auto-initializing: create hidden overlay so it doesn't create its own -->
    <div id="loading-overlay" class="loading-overlay" style="display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important;"></div>

    <!-- Loading screen (hidden by default) -->
    <div class="loading-screen hidden" id="loadingScreen">
        <div class="loading-message">Chargement des jeux...</div>
    </div>

    <!-- Game covers rain -->
    <div class="covers-container" id="coversContainer"></div>

    <!-- 404 Overlay - Always visible -->
    <div class="error-overlay" id="errorOverlay">
        <div class="error-text">404</div>
    </div>

    <!-- Action buttons - Always visible -->
    <div class="action-buttons" id="actionButtons">
        <a href="/" class="arcade-btn">🏠 Accueil</a>
    </div>

    <!-- Load CSS -->
    <link rel="stylesheet" href="/assets/css/style.css">
    
    <script>
        // Redirect logic (runs first)
        (function() {
            const path = window.location.pathname;
            
            // Check if the path matches /b/game_id pattern
            const match = path.match(/^\/b\/([^\/]+)$/);
            
            if (match) {
                // Extract the game_id from the path
                const gameId = match[1];
                
                // Only load loading.js when we need to redirect
                const script = document.createElement('script');
                script.src = '/assets/js/loading.js';
                script.onload = function() {
                    // Hide the main loading overlay that loading.js might have created/auto-initialized
                    const mainOverlay = document.getElementById('loading-overlay');
                    if (mainOverlay) {
                        mainOverlay.style.display = 'none';
                        mainOverlay.style.visibility = 'hidden';
                        mainOverlay.style.opacity = '0';
                        mainOverlay.classList.add('hidden');
                    }
                    
                    const redirectOverlay = document.getElementById('redirectOverlay');
                    
                    // Use loading.js function to create loading content
                    if (window.createLoadingOverlay) {
                        // Temporarily create overlay to get content, then hide it
                        const tempOverlay = window.createLoadingOverlay();
                        if (tempOverlay) {
                            tempOverlay.style.display = 'none';
                            tempOverlay.classList.add('hidden');
                        }
                        
                        const loadingContent = tempOverlay?.querySelector('.loading-content');
                        
                        if (loadingContent) {
                            // Copy the content to our redirect overlay
                            redirectOverlay.innerHTML = loadingContent.outerHTML;
                            
                            // Update the text
                            const textElement = redirectOverlay.querySelector('.loading-text');
                            if (textElement) {
                                textElement.textContent = 'Redirection en cours...';
                            }
                            
                            // Show the overlay
                            redirectOverlay.classList.add('active');
                        }
                    }
                    
                    // Redirect to /play/?game=game_id
                    setTimeout(() => {
                        window.location.href = `/play/?game=${encodeURIComponent(gameId)}`;
                    }, 500);
                };
                document.head.appendChild(script);
                return;
            }
        })();

        // Game state
        let games = [];
        let columns = [];
        const columnWidth = 120; // pixels
        const scrollSpeed = 0.5; // pixels per frame
        let animationId = null;

        // Initialize
        async function init() {
            const isLocalhost = window.location.hostname === 'localhost' || 
                               window.location.hostname === '127.0.0.1' || 
                               window.location.hostname.startsWith('192.168.');
            const cacheBuster = '?v=' + Date.now();
            
            // Try multiple paths for gamelist.json
            const possiblePaths = isLocalhost ? [
                'gamelist.json',
                '../gamelist.json',
                '/gamelist.json'
            ] : [
                'https://storage.googleapis.com/bonjourarcade/gamelist.json'
            ];

            let data = null;
            let lastError = null;

            // Try each path until one works
            for (const path of possiblePaths) {
                try {
                    const url = path + cacheBuster;
                    const response = await fetch(url);
                    if (response.ok) {
                        data = await response.json();
                        break;
                    }
                } catch (error) {
                    lastError = error;
                    continue;
                }
            }

            if (!data) {
                console.error('Error loading games from all paths:', lastError);
                // Show error but don't redirect - show the 404 page anyway
                const errorMsg = document.createElement('div');
                errorMsg.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; text-align: center; z-index: 300;';
                errorMsg.innerHTML = '<p>Erreur de chargement des jeux</p><p style="font-size: 0.8rem; opacity: 0.7;">La page 404 s\'affiche quand même</p>';
                document.body.appendChild(errorMsg);
                return;
            }
                
            // Filter games: must have coverArt and pageUrl (for clickability)
            games = (data.games || []).filter(game => 
                game.coverArt && 
                game.coverArt.trim() !== '' &&
                game.pageUrl && 
                game.pageUrl.trim() !== ''
            );

            if (games.length === 0) {
                console.warn('No games with covers found, but showing 404 page anyway');
                // Don't redirect, just show the page
                return;
            }

            // Shuffle games for variety
            shuffleArray(games);

            // Create columns
            createColumns();
            
            // Start animation
            animate();
        }

        // Shuffle array
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Create columns
        function createColumns() {
            const container = document.getElementById('coversContainer');
            const viewportWidth = window.innerWidth || document.documentElement.clientWidth;
            const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
            
            // Calculate number of columns needed to fully cover width
            // Use Math.ceil to ensure we have enough, then add 3 more for safety
            const numColumns = Math.ceil(viewportWidth / columnWidth) + 3;
            
            // Clear existing columns
            container.innerHTML = '';
            columns = [];
            
            // Create columns
            for (let i = 0; i < numColumns; i++) {
                const column = document.createElement('div');
                column.className = 'cover-column';
                column.style.width = columnWidth + 'px';
                column.style.left = (i * columnWidth) + 'px';
                
                // Populate column with covers (do this before appending to measure height)
                populateColumn(column);
                
                container.appendChild(column);
                
                // Calculate initial Y position - start way above viewport to ensure coverage
                // All columns start from the same high position to prevent gaps
                // Use a very negative value to ensure full coverage from the start
                const coverHeight = columnWidth + 10;
                const columnHeight = column.offsetHeight || (viewportHeight * 3);
                const initialY = -columnHeight + (viewportHeight * 0.5); // Start high enough to cover top
                
                columns.push({
                    element: column,
                    y: initialY
                });
                
                // Set initial position immediately
                column.style.transform = `translateY(${initialY}px)`;
            }
            
            // Force a layout recalculation to ensure columns are positioned
            container.offsetHeight;
            
            // Verify coverage
            const lastColumnRight = (numColumns - 1) * columnWidth + columnWidth;
            if (lastColumnRight < viewportWidth) {
                console.warn('Columns may not fully cover viewport width');
            }
        }

        // Populate a column with covers
        function populateColumn(column) {
            // Add enough covers to fill viewport + large buffer to prevent gaps
            // Calculate based on cover height (columnWidth + gap)
            const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
            const coverHeight = columnWidth + 10; // width + gap
            // Ensure we have enough covers to fill 4x viewport height to cover from way above to way below
            const coversPerColumn = Math.ceil((viewportHeight * 4) / coverHeight) + 20;
            
            for (let i = 0; i < coversPerColumn; i++) {
                const cover = createCoverItem();
                column.appendChild(cover);
            }
        }

        // Create a cover item
        function createCoverItem() {
            const game = games[Math.floor(Math.random() * games.length)];
            
            // Create wrapper for tooltip
            const wrapper = document.createElement('div');
            wrapper.className = 'cover-item-wrapper';
            
            // Store game data for click navigation
            if (game.pageUrl) {
                wrapper.dataset.gameUrl = game.pageUrl;
                wrapper.dataset.gameId = game.id;
            }
            
            const img = document.createElement('img');
            img.className = 'cover-item';
            img.src = game.coverArt;
            img.alt = game.title || game.id;
            img.dataset.gameTitle = game.title || game.id;
            
            // Create tooltip
            const tooltip = document.createElement('div');
            tooltip.className = 'cover-tooltip';
            tooltip.textContent = game.title || game.id;
            
            // Add click handler to launch game
            if (game.pageUrl) {
                wrapper.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    // Navigate to game page
                    window.location.href = game.pageUrl;
                });
            }
            
            img.onerror = function() {
                // If image fails to load, try placeholder
                if (this.src !== '/assets/images/placeholder_thumb.png') {
                    this.src = '/assets/images/placeholder_thumb.png';
                } else {
                    // If placeholder also fails, use a fallback color
                    this.style.backgroundColor = '#333';
                    this.style.display = 'flex';
                    this.style.alignItems = 'center';
                    this.style.justifyContent = 'center';
                    this.style.color = '#666';
                    this.style.fontSize = '0.8rem';
                }
            };
            
            wrapper.appendChild(img);
            wrapper.appendChild(tooltip);
            
            return wrapper;
        }

        // Animation loop
        function animate() {
            const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
            const viewportWidth = window.innerWidth || document.documentElement.clientWidth;
            
            columns.forEach((column, index) => {
                // Move column down
                column.y += scrollSpeed;
                column.element.style.transform = `translateY(${column.y}px)`;
                
                // Get column height (use a fallback if not yet measured)
                let columnHeight = column.element.offsetHeight;
                if (columnHeight === 0) {
                    // Estimate height based on number of covers
                    const coverCount = column.element.querySelectorAll('.cover-item-wrapper').length;
                    columnHeight = coverCount * (columnWidth + 10);
                }
                
                // If column has scrolled past bottom, reset to top
                // Reset when the top of the column passes the bottom of viewport
                if (column.y > viewportHeight) {
                    // Reset to start above viewport
                    // Use a large negative value to ensure smooth transition and full coverage
                    const resetY = -Math.max(columnHeight, viewportHeight * 3.5);
                    column.y = resetY;
                    
                    // Refresh covers in column with new random games
                    const wrappers = column.element.querySelectorAll('.cover-item-wrapper');
                    wrappers.forEach((wrapper, index) => {
                        const img = wrapper.querySelector('.cover-item');
                        const tooltip = wrapper.querySelector('.cover-tooltip');
                        const newGame = games[Math.floor(Math.random() * games.length)];
                        
                        if (img && newGame && newGame.coverArt) {
                            img.src = newGame.coverArt;
                            img.alt = newGame.title || newGame.id;
                            img.dataset.gameTitle = newGame.title || newGame.id;
                            
                            // Update game URL for click navigation
                            if (newGame.pageUrl) {
                                wrapper.dataset.gameUrl = newGame.pageUrl;
                                wrapper.dataset.gameId = newGame.id;
                                
                                // Remove existing click handlers by cloning without listeners
                                const newWrapper = wrapper.cloneNode(true);
                                wrapper.parentNode.replaceChild(newWrapper, wrapper);
                                
                                // Add click handler to launch game
                                newWrapper.addEventListener('click', function(e) {
                                    e.preventDefault();
                                    e.stopPropagation();
                                    window.location.href = newGame.pageUrl;
                                });
                            }
                            
                            if (tooltip) {
                                tooltip.textContent = newGame.title || newGame.id;
                            }
                        }
                    });
                }
                
                // Safety check: ensure column always covers viewport vertically
                // Check both top and bottom coverage
                const columnTop = column.y;
                const columnBottom = column.y + columnHeight;
                
                // If top of column is below viewport top, we have a gap
                if (columnTop > 0) {
                    // Add covers to the top
                    const coverHeight = columnWidth + 10;
                    const neededCovers = Math.ceil((columnTop + viewportHeight) / coverHeight) + 5;
                    for (let i = 0; i < neededCovers; i++) {
                        const cover = createCoverItem();
                        column.element.insertBefore(cover, column.element.firstChild);
                    }
                    // Recalculate position
                    column.y = columnTop - (neededCovers * coverHeight);
                }
                
                // If bottom is getting close to viewport bottom, add more covers
                if (columnBottom < viewportHeight + 200) {
                    const coverHeight = columnWidth + 10;
                    const neededCovers = Math.ceil((viewportHeight * 2 - columnBottom) / coverHeight) + 10;
                    for (let i = 0; i < neededCovers; i++) {
                        const cover = createCoverItem();
                        column.element.appendChild(cover);
                    }
                }
                
                // Ensure column is still positioned correctly horizontally
                const expectedLeft = index * columnWidth;
                if (Math.abs(parseFloat(column.element.style.left) - expectedLeft) > 1) {
                    column.element.style.left = expectedLeft + 'px';
                }
            });

            animationId = requestAnimationFrame(animate);
        }

        // Handle window resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                // Recreate columns on resize to ensure full coverage
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
                document.getElementById('coversContainer').innerHTML = '';
                columns = [];
                createColumns();
                animate();
            }, 250);
        });

        // Periodic check to ensure columns always cover the viewport
        setInterval(() => {
            const viewportWidth = window.innerWidth;
            const currentColumns = document.querySelectorAll('.cover-column').length;
            const expectedColumns = Math.ceil(viewportWidth / columnWidth) + 2;
            
            // If columns are missing, recreate them
            if (currentColumns < expectedColumns - 1) {
                console.log('Recreating columns to fix coverage');
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
                document.getElementById('coversContainer').innerHTML = '';
                columns = [];
                createColumns();
                animate();
            }
        }, 2000);

        // Initialize on load
        function startInit() {
            try {
                init();
            } catch (error) {
                console.error('Error in init():', error);
                // Even if init fails, show the 404 page
                const errorOverlay = document.getElementById('errorOverlay');
                const actionButtons = document.getElementById('actionButtons');
                if (errorOverlay) errorOverlay.style.display = 'flex';
                if (actionButtons) actionButtons.style.display = 'flex';
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startInit);
        } else {
            // DOM already ready
            startInit();
        }
    </script>
</body>
</html>
