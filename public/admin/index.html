<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BonjourArcade Admin - Scores</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body {
            background-color: #111;
            color: #eee;
            font-family: sans-serif;
            padding: 20px;
        }

        h1,
        h2 {
            color: #ffd700;
        }

        #auth-section,
        #admin-section {
            background: #222;
            padding: 20px;
            border-radius: 8px;
            max-width: 800px;
            margin: 0 auto;
        }

        .score-card {
            background: #1a1a1a;
            border: 1px solid #444;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
        }

        .score-screenshot-button {
            display: inline-block;
            padding: 0;
            margin: 0 0 10px;
            border: 1px solid #444;
            border-radius: 8px;
            overflow: hidden;
            background: #262626;
            cursor: zoom-in;
        }

        .score-card img {
            width: min(220px, 100%);
            max-width: 100%;
            border-radius: 0;
            display: block;
            margin-bottom: 0;
        }

        .score-screenshot-hint {
            display: block;
            padding: 6px 10px;
            font-size: 12px;
            color: #bbb;
            background: #202020;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            font-weight: bold;
        }

        .btn-approve {
            background: #00C851;
            color: white;
        }

        .btn-reject {
            background: #ff4444;
            color: white;
        }

        .admin-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .admin-actions button {
            flex: 1;
            margin-right: 0 !important;
            padding: 12px;
            font-size: 14px;
        }

        .btn-login {
            background: #4285F4;
            color: white;
            font-size: 16px;
            padding: 12px 24px;
        }

        input,
        textarea {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 4px;
            width: 100%;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .score-meta {
            color: #aaa;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .image-modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
        }

        .image-modal.is-open {
            display: flex;
        }

        .image-modal-content {
            max-width: min(90vw, 1200px);
            max-height: 90vh;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #555;
            background: #111;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .image-modal-content img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 90vh;
            object-fit: contain;
        }
    </style>
</head>

<body>
    <div id="auth-section">
        <h1>Adminstration des Scores</h1>
        <p>Veuillez vous connecter avec un compte administrateur.</p>
        <button id="admin-login-btn" class="btn-login">Connexion avec Google</button>
    </div>

    <div id="admin-section" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h1>Scores en Attente</h1>
            <button id="admin-logout-btn" style="background:#555; color:white;">Déconnexion</button>
        </div>
        <div id="scores-container">
            <p>Chargement des scores...</p>
        </div>
    </div>

    <div id="image-modal" class="image-modal" role="dialog" aria-modal="true" aria-label="Agrandissement du screenshot">
        <div class="image-modal-content">
            <img id="image-modal-preview" alt="Screenshot agrandi">
        </div>
    </div>

    <!-- The type="module" is handled inside firebase-setup.js to allow async await -->
    <script type="module" src="../assets/js/firebase-setup.js"></script>
    <script type="module" src="admin.js"></script>
</body>

</html>
