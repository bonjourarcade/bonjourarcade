<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tous les jeux</title>
    <style>
        :root {
            --background: #f0f0f0;
            --text-color: #222;
            --card-bg: white;
            --card-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            --border-color: #ddd;
        }

        body.theme-dark {
            --background: #181a1b;
            --text-color: #f4f4f4;
            --card-bg: #23272b;
            --card-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            --border-color: #444;
        }

        body {
            font-family: sans-serif;
            background: var(--background);
            color: var(--text-color);
            margin: 0;
            padding: 1rem;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
            /* Prevent horizontal scrollbar */
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        .game {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
            box-shadow: var(--card-shadow);
            transition: transform 0.2s, background-color 0.3s;
            border: 1px solid var(--border-color);
            /* Remove flex and aspect-ratio from .game */
            width: 100%;
            box-sizing: border-box;
        }

        /* Responsive game card adjustments */
        @media (max-width: 480px) {
            .game {
                border-radius: 6px;
            }

            .game-title {
                padding: 0.4rem;
                font-size: 1rem;
                line-height: 1.2;
            }

            .new-badge {
                font-size: 0.7em;
                padding: 1px 8px;
                top: 5px;
                left: 5px;
            }
        }

        .game-cover {
            aspect-ratio: 0.73;
            width: 100%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.theme-dark .game-cover {
            background: #333;
        }

        .game-cover img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #ddd;
            display: block;
        }

        body.theme-dark .game-cover img {
            background: #333;
        }

        .game-title {
            padding: 0.5rem;
            color: var(--text-color);
            background: var(--card-bg);
            text-decoration: none !important;
            border-bottom: none !important;
            font-weight: bold;
            font-size: 1.2rem;
            line-height: 1.3;
        }

        .game-link {
            text-decoration: none !important;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .theme-toggle {
            background: none;
            border: 2px solid var(--text-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            background: var(--text-color);
            color: var(--background);
        }

        .random-game-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .random-game-btn:hover {
            background-color: #45a049;
        }

        .random-info-text {
            font-size: 0.8rem;
            color: #666;
            margin-top: 0.2rem;
            text-align: center;
            font-style: italic;
        }

        body.theme-dark .random-info-text {
            color: #aaa;
        }

        .game-new {
            border: 2.5px solid #ff9800 !important;
            box-shadow: 0 0 0 3px #fff6, 0 2px 8px #ff980055;
            position: relative;
        }

        .new-badge {
            position: absolute;
            top: 7px;
            left: 7px;
            background: linear-gradient(90deg, #ff9800, #ffc107);
            color: #fff;
            font-weight: bold;
            font-size: 0.82em;
            padding: 2px 10px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ff980055;
            z-index: 2;
            letter-spacing: 1px;
            pointer-events: none;
        }

        /* Search functionality styles */
        .search-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .search-input {
            flex: 1;
            max-width: 600px;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--card-bg);
            color: var(--text-color);
            transition: border-color 0.3s, background-color 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        .search-input::placeholder {
            color: #999;
        }

        .search-info {
            font-size: 0.9rem;
            color: #666;
            margin-left: 1rem;
        }

        body.theme-dark .search-info {
            color: #aaa;
        }

        .filter-count {
            font-size: 0.9rem;
            color: #666;
            font-weight: 500;
            white-space: nowrap;
        }

        body.theme-dark .filter-count {
            color: #aaa;
        }

        .no-results {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-style: italic;
        }

        body.theme-dark .no-results {
            color: #aaa;
        }

        /* Mobile responsive fixes */
        @media (max-width: 768px) {
            body {
                padding: 0.5rem;
            }

            .search-container {
                width: 100% !important;
                margin-bottom: 1rem !important;
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 0.5rem !important;
            }

            .search-container>*:not(.filter-count) {
                width: 100% !important;
                margin: 0 !important;
                border-radius: 8px !important;
            }

            .filter-count {
                text-align: center !important;
                margin-top: 0.5rem !important;
                font-size: 0.8rem !important;
            }

            .search-input {
                width: 100%;
                max-width: none;
                box-sizing: border-box;
                border-radius: 8px !important;
            }

            .random-game-btn {
                font-size: 0.9rem;
                padding: 0.6rem 1rem;
                white-space: nowrap;
                min-width: auto;
                width: auto;
            }

            .theme-toggle {
                font-size: 0.8rem;
                padding: 0.4rem 0.8rem;
                min-width: auto;
                width: auto;
            }

            #back-home-btn {
                font-size: 0.9rem;
                padding: 0.5rem 1rem;
                white-space: nowrap;
                min-width: auto;
                width: auto;
            }

            #header-container {
                gap: 0.5rem !important;
                margin-bottom: 0.5rem !important;
            }

            #header-buttons {
                gap: 0.3rem !important;
            }
        }

        /* Extra small mobile devices */
        @media (max-width: 480px) {
            body {
                padding: 0.3rem;
            }

            .search-container {
                margin-bottom: 0.8rem !important;
                gap: 0.3rem !important;
            }

            .random-game-btn {
                font-size: 0.8rem;
                padding: 0.5rem 0.8rem;
            }

            .theme-toggle {
                font-size: 0.7rem;
                padding: 0.3rem 0.6rem;
            }

            #back-home-btn {
                font-size: 0.8rem;
                padding: 0.4rem 0.8rem;
            }

            /* Ensure header text wraps properly */
            .header-content h1 {
                font-size: 1.2rem;
                line-height: 1.3;
                word-break: break-word;
                overflow-wrap: break-word;
            }

            .header-content h2 {
                font-size: 1rem;
                line-height: 1.3;
                word-break: break-word;
                overflow-wrap: break-word;
            }
        }

        /* Very small screens */
        @media (max-width: 360px) {
            .header-content h1 {
                font-size: 1.1rem;
            }

            .header-content h2 {
                font-size: 0.9rem;
            }
        }

        /* Smooth transitions for show/hide */
        #header-container,
        #header-content {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        #header-container[style*="display: none"],
        #header-content[style*="display: none"] {
            opacity: 0;
            transform: translateY(-10px);
        }

        /* Prevent layout shifts and scrollbar appearance */
        html,
        body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
        }

        /* Ensure grid layout remains stable */
        .grid {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            display: block;
        }

        /* Section headers styling */
        .section-header {
            margin: 1rem 0 0.5rem 0;
            padding: 0.3rem 0;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: var(--background);
            z-index: 10;
        }

        .section-header h2 {
            margin: 0;
            font-size: 3rem;
            font-weight: bold;
            color: var(--text-color);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Collapsible header styling */
        .collapsible-header {
            cursor: pointer;
            user-select: none;
        }

        .collapsible-header:hover {
            opacity: 0.8;
        }

        .collapse-icon {
            font-size: 1.5rem;
            vertical-align: middle;
        }

        .section-games {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 1.2rem;
            margin-bottom: 0.5rem;
            width: 100%;
        }

        /* Responsive section adjustments */
        @media (max-width: 768px) {
            .section-header {
                margin: 0.8rem 0 0.4rem 0;
                padding: 0.2rem 0;
            }

            .section-header h2 {
                font-size: 2.2rem;
                letter-spacing: 2px;
            }

            .section-games {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 12px;
                margin-bottom: 0.3rem;
                width: 100%;
            }
        }

        /* Prevent any horizontal overflow */
        * {
            max-width: 100%;
            box-sizing: border-box;
        }

        /* Ensure header content doesn't overflow */
        .header-content {
            width: 100%;
            max-width: 100%;
            overflow-wrap: break-word;
            word-wrap: break-word;
            hyphens: auto;
        }

        .header-content h1,
        .header-content h2 {
            width: 100%;
            max-width: 100%;
            overflow-wrap: break-word;
            word-wrap: break-word;
            hyphens: auto;
            margin: 0;
            padding: 0;
        }

        /* Responsive grid adjustments - match main index.html */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 15px;
                width: 100%;
                max-width: 100%;
            }
        }

        /* Fix banner spacer styling */
        #bonjourarcade-banner-spacer {
            background: transparent !important;
            border: none !important;
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            display: block !important;
            max-width: 100vw !important;
            overflow: hidden !important;
        }

        /* Ensure banner doesn't cause visual artifacts */
        .bonjourarcade-banner {
            background: #3460e5 !important;
            border: none !important;
            margin: 0 !important;
            padding: 12px 0 !important;
            width: 100% !important;
            max-width: 100vw !important;
            overflow: hidden !important;
        }

        /* Container constraints */
        #header-container,
        .search-container,
        #header-content,
        #gameGrid {
            width: 100% !important;
            max-width: 100% !important;
            overflow: hidden !important;
            box-sizing: border-box !important;
        }

        /* Hide tooltips on mobile devices */
        @media (max-width: 768px) {
            .game-meta-tooltip {
                display: none !important;
                opacity: 0 !important;
                visibility: hidden !important;
            }
        }
    </style>
    <style>
        .game-meta-tooltip {
            z-index: 9999 !important;
            position: fixed !important;
            pointer-events: none;
            background: rgba(24, 24, 24, 0.92) !important;
            color: #fff !important;
            border-radius: 10px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.28);
            padding: 18px 22px;
            min-width: 180px;
            max-width: 340px;
            font-size: 1.08em;
            font-family: inherit;
            opacity: 0.98;
            transition: opacity 0.15s;
        }

        .game-meta-table .meta-label {
            color: #fff !important;
        }

        .game-meta-table .meta-value {
            color: #fff !important;
        }
    </style>
    <script src="../assets/js/analytics.js"></script>
</head>

<body>
    <div id="header-container"
        style="display: flex; justify-content: flex-start; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem;">
        <button id="back-home-btn"
            style="padding: 0.6rem 1.2rem; font-size: 1rem; border-radius: 6px; border: none; background: #222; color: #fff; cursor: pointer; font-family: sans-serif; box-shadow: 0 2px 6px rgba(0,0,0,0.08);">←
            Retour Accueil</button>

        <div id="header-buttons" style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;">
            <button id="theme-toggle" class="theme-toggle" style="margin-right: 0;">🌙</button>
            <button id="random-game-btn" class="random-game-btn">🎲 Jeu aléatoire (avec filtres)</button>
            <button id="screensaver-btn" class="screensaver-btn"
                style="padding: 0.6rem 1.2rem; font-size: 1rem; border-radius: 6px; border: none; background: linear-gradient(45deg, #ff6b6b, #ee5a24); color: #fff; cursor: pointer; font-family: sans-serif; box-shadow: 0 2px 6px rgba(0,0,0,0.2);">🌠
                Mode écran de veille (avec filtres)</button>
        </div>
    </div>

    <div class="search-container"
        style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
        <select id="search-type"
            style="padding: 0.75rem 0.5rem; border: 2px solid var(--border-color); border-radius: 8px 0 0 8px; font-size: 1rem; background: var(--card-bg); color: var(--text-color); border-right: none; cursor: pointer;">
            <option value="title">Titre</option>
            <option value="genre">Genre</option>
            <option value="developer">Développeur</option>
            <option value="system">Système</option>

            <option value="history">Historique</option>
            <option value="missing-metadata">Métadonnées manquantes</option>
        </select>
        <input type="text" id="search-input" class="search-input" placeholder="Rechercher par titre..."
            style="border-radius: 0 8px 8px 0; border-left: none; flex: 1; min-width: 200px;">
        <select id="genre-select"
            style="display: none; padding: 0.75rem 1rem; border: 2px solid var(--border-color); border-radius: 0 8px 8px 0; font-size: 1rem; background: var(--card-bg); color: var(--text-color); border-left: none; cursor: pointer;">
            <option value="">Sélectionner un genre...</option>
        </select>
        <select id="developer-select"
            style="display: none; padding: 0.75rem 1rem; border: 2px solid var(--border-color); border-radius: 0 8px 8px 0; font-size: 1rem; background: var(--card-bg); color: var(--text-color); border-left: none; cursor: pointer;">
            <option value="">Sélectionner un développeur...</option>
        </select>
        <select id="system-select"
            style="display: none; padding: 0.75rem 1rem; border: 2px solid var(--border-color); border-radius: 0 8px 8px 0; font-size: 1rem; background: var(--card-bg); color: var(--text-color); border-left: none; cursor: pointer;">
            <option value="">Sélectionner un système...</option>
        </select>
        <select id="sort-select"
            style="padding: 0.75rem 0.5rem; border: 2px solid var(--border-color); border-radius: 8px; font-size: 1rem; background: var(--card-bg); color: var(--text-color); cursor: pointer;">
            <option value="random">Trier: Aléatoire</option>
            <option value="alpha">Trier: Alphabétique</option>
            <option value="latest">Trier: Derniers ajouts</option>
            <option value="year-asc">Trier: Année (croissant)</option>
            <option value="year-desc">Trier: Année (décroissant)</option>
        </select>
        <button id="share-link-btn" class="share-link-btn"
            style="padding: 0.75rem 1rem; border: 2px solid var(--border-color); border-radius: 8px; font-size: 1rem; background: var(--card-bg); color: var(--text-color); cursor: pointer; white-space: nowrap;"
            title="Copier le lien partageable du filtre actuel">🔗 Partager le filtre</button>
        <span class="search-info" id="search-info"></span>
        <div class="filter-count" id="filter-count">Chargement...</div>
        <button id="reset-filters"
            style="padding: 0.6rem 0.9rem; font-size: 0.95rem; border-radius: 8px; border: 2px solid var(--border-color); background: var(--card-bg); color: var(--text-color); cursor: pointer;">Réinitialiser</button>
    </div>

    <div id="header-content" class="header-content">
        <div class="header-left">
        </div>
    </div>


    <div class="grid" id="gameGrid"></div>

    <script src="../assets/js/banner.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script>
        // Store all games data globally
        let gamesData = [];
        let filteredGamesData = [];

        let gameHistory = [];
        const FILTERS_STORAGE_KEY = 'bonjourarcade_all_filters_v1';

        function getFiltersState() {
            return {
                searchType: document.getElementById('search-type').value,
                searchInput: document.getElementById('search-input').value,
                genre: document.getElementById('genre-select').value,
                developer: document.getElementById('developer-select').value,
                system: document.getElementById('system-select').value,
                sort: document.getElementById('sort-select').value
            };
        }

        function saveFiltersState() {
            try {
                localStorage.setItem(FILTERS_STORAGE_KEY, JSON.stringify(getFiltersState()));
            } catch (e) { /* ignore */ }
        }

        function loadFiltersState() {
            try {
                const raw = localStorage.getItem(FILTERS_STORAGE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }

        function applySavedFilters() {
            const state = loadFiltersState();
            if (!state) return;
            const searchTypeEl = document.getElementById('search-type');
            const searchInputEl = document.getElementById('search-input');
            const genreEl = document.getElementById('genre-select');
            const developerEl = document.getElementById('developer-select');
            const systemEl = document.getElementById('system-select');
            const sortEl = document.getElementById('sort-select');

            if (state.searchType) {
                searchTypeEl.value = state.searchType;
                // Trigger change to show correct controls and populate lists
                searchTypeEl.dispatchEvent(new Event('change'));
            }
            if (state.searchType === 'title' && typeof state.searchInput === 'string') {
                searchInputEl.value = state.searchInput;
                filterGames(searchInputEl.value);
            } else if (state.searchType === 'genre' && state.genre) {
                // options already populated by change handler
                genreEl.value = state.genre;
                filterGames(genreEl.value);
            } else if (state.searchType === 'developer' && state.developer) {
                developerEl.value = state.developer;
                filterGames(developerEl.value);
            } else if (state.searchType === 'system' && state.system) {
                systemEl.value = state.system;
                filterGames(systemEl.value);
            } else if (state.searchType === 'week' || state.searchType === 'history' || state.searchType === 'missing-metadata') {
                filterGames('');
            }
            if (state.sort) {
                sortEl.value = state.sort;
                const current = (filteredGamesData.length > 0 || searchInputEl.value || genreEl.value || developerEl.value || systemEl.value || searchTypeEl.value === 'week' || searchTypeEl.value === 'history' || searchTypeEl.value === 'missing-metadata')
                    ? filteredGamesData
                    : gamesData;
                renderGames(current);
            }
            updateSearchInfo();
        }

        // Function to get current week number in YYYYWW format
        function getCurrentWeek() {
            const now = new Date();
            const year = now.getFullYear();
            const startOfYear = new Date(year, 0, 1);
            const days = Math.floor((now - startOfYear) / (24 * 60 * 60 * 1000));
            const weekNumber = Math.ceil((days + startOfYear.getDay() + 1) / 7);
            return year * 100 + weekNumber;
        }

        // Game history management functions
        function loadGameHistory() {
            try {
                const historyData = localStorage.getItem('gameHistory');
                if (historyData) {
                    gameHistory = JSON.parse(historyData);
                } else {
                    gameHistory = [];
                }
                return gameHistory;
            } catch (error) {
                console.error('Error loading game history:', error);
                gameHistory = [];
                return gameHistory;
            }
        }

        function saveGameHistory() {
            try {
                localStorage.setItem('gameHistory', JSON.stringify(gameHistory));
            } catch (error) {
                console.error('Error saving game history:', error);
            }
        }

        function addGameToHistory(gameId) {
            if (!gameId) return;

            // Remove if already exists to avoid duplicates
            gameHistory = gameHistory.filter(entry => entry.gameId !== gameId);

            // Add to beginning of array (most recent first)
            gameHistory.unshift({
                gameId: gameId,
                timestamp: Date.now(),
                date: new Date().toISOString()
            });

            // Keep only last 50 games to avoid storage bloat
            if (gameHistory.length > 50) {
                gameHistory = gameHistory.slice(0, 50);
            }

            saveGameHistory();
        }

        function getHistoryGameIds() {
            // Always load fresh data from sessionStorage
            const freshHistory = loadGameHistory();
            // Ensure we have an array before calling map
            if (!Array.isArray(freshHistory)) {
                console.warn('History data is not an array:', freshHistory);
                return [];
            }
            return freshHistory.map(entry => entry.gameId);
        }

        // Back to home button
        document.getElementById('back-home-btn').addEventListener('click', function () {
            window.location.href = '../index.html';
        });

        // Function to scroll to a specific game
        function scrollToGame(gameId) {
            if (!gameId) return;

            // Wait for games to be rendered
            setTimeout(() => {
                // Find the game element by its link href
                const gameLink = document.querySelector(`a[href="../play?game=${gameId}"]`);
                if (gameLink) {
                    const gameElement = gameLink.closest('.game');
                    if (gameElement) {
                        // Jump to the game instantly
                        gameElement.scrollIntoView({
                            behavior: 'auto',
                            block: 'center'
                        });

                        // Add a prominent animation effect
                        gameElement.style.backgroundColor = 'rgba(76, 175, 80, 0.15)';
                        gameElement.style.boxShadow = '0 0 25px rgba(76, 175, 80, 0.5), 0 0 50px rgba(76, 175, 80, 0.3)';
                        gameElement.style.transform = 'scale(1.05)';
                        gameElement.style.transition = 'background-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease';

                        // Add a pulsing animation
                        let pulseCount = 0;
                        const maxPulses = 3;
                        const pulseInterval = setInterval(() => {
                            pulseCount++;
                            if (pulseCount <= maxPulses) {
                                // Pulse effect
                                gameElement.style.transform = 'scale(1.08)';
                                gameElement.style.boxShadow = '0 0 35px rgba(76, 175, 80, 0.7), 0 0 70px rgba(76, 175, 80, 0.4)';

                                setTimeout(() => {
                                    gameElement.style.transform = 'scale(1.05)';
                                    gameElement.style.boxShadow = '0 0 25px rgba(76, 175, 80, 0.5), 0 0 50px rgba(76, 175, 80, 0.3)';
                                }, 300);
                            } else {
                                clearInterval(pulseInterval);
                                // Final fade out
                                setTimeout(() => {
                                    gameElement.style.backgroundColor = '';
                                    gameElement.style.boxShadow = '';
                                    gameElement.style.transform = '';
                                }, 1000);
                            }
                        }, 600);
                    }
                }
            }, 100);
        }

        // Theme management
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('theme-dark');
                document.getElementById('theme-toggle').textContent = '☀️';
            } else {
                document.body.classList.remove('theme-dark');
                document.getElementById('theme-toggle').textContent = '🌙';
            }
        }

        function toggleTheme() {
            const body = document.body;
            const toggle = document.getElementById('theme-toggle');

            if (body.classList.contains('theme-dark')) {
                body.classList.remove('theme-dark');
                localStorage.setItem('theme', 'light');
                toggle.textContent = '🌙';
            } else {
                body.classList.add('theme-dark');
                localStorage.setItem('theme', 'dark');
                toggle.textContent = '☀️';
            }
        }

        // Utility function to remove accents from text
        function removeAccents(text) {
            if (!text) return '';
            return text.normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '') // Remove diacritics
                .toLowerCase();
        }


        // Search functionality
        function filterGames(searchTerm) {
            const searchType = document.getElementById('search-type').value;

            if (!searchTerm && searchType !== 'week' && searchType !== 'history' && searchType !== 'missing-metadata') {
                filteredGamesData = gamesData;
                updateSearchInfo();
                renderGames(filteredGamesData);
                showHeaderElements(); // Show header elements when search is cleared
                showSectionHeaders(); // Show section headers when search is cleared
                updateShareableUrl(); // Update URL when filter is cleared
                return;
            }

            // Handle missing metadata filter
            if (searchType === 'missing-metadata') {
                // Filter games that are missing title or cover image
                filteredGamesData = gamesData.filter(game => {
                    // Check if title is missing
                    // A title is considered missing if:
                    // - No title at all, OR
                    // - Title equals game id AND no other metadata (developer, year, genre) exists
                    const hasOtherMetadata = game.developer || game.year || game.genre;
                    const hasTitle = game.title && (game.title !== game.id || hasOtherMetadata);

                    // Check if cover image is missing (no coverArt or equals placeholder)
                    const hasCoverArt = game.coverArt && game.coverArt !== '/assets/images/placeholder_thumb.png';
                    // Show games that are missing either title or cover image
                    return !hasTitle || !hasCoverArt;
                });

                updateSearchInfo();
                renderGames(filteredGamesData);
                hideHeaderElements(); // Hide header elements when filtering
                hideSectionHeaders(); // Hide section headers when filtering
                updateShareableUrl(); // Update URL with missing-metadata filter
                return;
            }



            // Handle history filter
            if (searchType === 'history') {
                const gameHistory = loadGameHistory();
                const historyGameIds = gameHistory.map(entry => entry.gameId);

                // Filter games that are in the history
                filteredGamesData = gamesData.filter(game => {
                    return historyGameIds.includes(game.id);
                });

                // If no games in history, show a message
                if (filteredGamesData.length === 0) {
                    const container = document.getElementById('gameGrid');
                    container.innerHTML = '<div class="no-results">Aucun jeu dans votre historique. Lancez quelques jeux pour les voir apparaître ici !</div>';
                    hideHeaderElements();
                    hideSectionHeaders();
                    updateShareableUrl(); // Update URL with history filter (even if empty)
                    return;
                }

                // Sort by timestamp (most recent first)
                filteredGamesData.sort((a, b) => {
                    const aEntry = gameHistory.find(entry => entry.gameId === a.id);
                    const bEntry = gameHistory.find(entry => entry.gameId === b.id);

                    // If entries not found, put them at the end
                    if (!aEntry || !bEntry) {
                        if (!aEntry && !bEntry) return 0;
                        if (!aEntry) return 1;
                        if (!bEntry) return -1;
                    }

                    // Sort by timestamp descending (most recent first)
                    return (bEntry.timestamp || 0) - (aEntry.timestamp || 0);
                });

                updateSearchInfo();
                renderGames(filteredGamesData);
                hideHeaderElements(); // Hide header elements when filtering
                hideSectionHeaders(); // Hide section headers when filtering
                updateShareableUrl(); // Update URL with history filter
                return;
            }

            const term = searchTerm.toLowerCase();

            // Filter based on search type
            filteredGamesData = gamesData.filter(game => {
                if (searchType === 'title') {
                    // Search only by title
                    let displayTitle = getDisplayTitle(game);
                    // Use accent-insensitive search
                    return removeAccents(displayTitle).includes(removeAccents(term));
                } else if (searchType === 'genre') {
                    // Search only by genre (exact match from dropdown, case insensitive)
                    // Check if any of the comma-separated genres match
                    if (game.genre) {
                        const individualGenres = game.genre.split(',').map(g => g.trim().toLowerCase());
                        return individualGenres.includes(term.toLowerCase());
                    }
                    return false;
                } else if (searchType === 'developer') {
                    // Search only by developer (exact match from dropdown, case insensitive)
                    // Check if any of the comma-separated developers match
                    if (game.developer) {
                        const individualDevelopers = game.developer.split(',').map(d => d.trim().toLowerCase());
                        return individualDevelopers.includes(term.toLowerCase());
                    }
                    return false;
                } else if (searchType === 'system') {
                    // Search only by system (exact match from dropdown, case insensitive)
                    if (game.core) {
                        const systemName = getSystemName(game.core);
                        return systemName.toLowerCase() === term.toLowerCase();
                    }
                    return false;
                }
                return false;
            });

            updateSearchInfo();
            renderGames(filteredGamesData);
            hideHeaderElements(); // Hide header elements when searching
            hideSectionHeaders(); // Hide section headers when searching
            updateShareableUrl(); // Update URL with current filter
        }

        function showHeaderElements() {
            const headerContainer = document.getElementById('header-container');
            const headerContent = document.getElementById('header-content');
            if (headerContainer) headerContainer.style.display = 'flex';
            if (headerContent) headerContent.style.display = 'block';
        }

        function hideHeaderElements() {
            const headerContainer = document.getElementById('header-container');
            const headerContent = document.getElementById('header-content');
            // Keep header container visible (contains back button, search, theme toggle, random button)
            // Only hide the header content (title text)
            if (headerContent) headerContent.style.display = 'none';
        }

        function showSectionHeaders() {
            const sectionHeaders = document.querySelectorAll('.section-header');
            sectionHeaders.forEach(header => {
                header.style.display = 'block';
            });
        }

        function hideSectionHeaders() {
            const sectionHeaders = document.querySelectorAll('.section-header');
            sectionHeaders.forEach(header => {
                header.style.display = 'none';
            });
        }

        function updateSearchInfo() {
            const searchInfo = document.getElementById('search-info');
            const filterCount = document.getElementById('filter-count');

            if (filteredGamesData.length === gamesData.length) {
                // No active filters - show total count in filter-count, hide search-info
                searchInfo.textContent = '';
                filterCount.textContent = `${filteredGamesData.length} jeux`;
                filterCount.style.display = 'block';
            } else {
                // Active filters - show detailed message in search-info, hide filter-count
                searchInfo.textContent = `${filteredGamesData.length} jeu${filteredGamesData.length > 1 ? 'x' : ''} trouvé${filteredGamesData.length > 1 ? 's' : ''}`;
                filterCount.style.display = 'none';
            }
        }

        function capitalizeFirst(str) {
            if (!str) return '';
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function hasRenderableGameId(game) {
            const gameId = String(game?.id || '').trim();
            return /[a-z0-9]/i.test(gameId);
        }

        function getDisplayTitle(game) {
            let displayTitle = game.title;
            if (!displayTitle || displayTitle === game.id) {
                displayTitle = capitalizeFirst(game.id);
            }

            // Normalize title for display (move "The" to the end)
            displayTitle = normalizeTitleForSorting(displayTitle);

            // Add problem indicator if the game has problems
            if (game.problem === "true") {
                displayTitle += ' (❌)';
            }

            return displayTitle;
        }

        /**
         * Safely parse the 'added' date from a game object and return a timestamp.
         * Returns -Infinity for missing/invalid dates so that games with a real date appear first when sorting newest-first.
         */
        function getAddedTimestamp(game) {
            if (!game || !game.added) return -Infinity;
            const t = Date.parse(game.added);
            if (isNaN(t)) return -Infinity;
            return t;
        }

        /**
         * Safely parse the 'year' from a game object and return a number.
         * Returns null for missing/invalid years so they can be handled separately in sorting.
         */
        function getGameYear(game) {
            if (!game || !game.year) return null;
            const year = parseInt(game.year);
            if (isNaN(year) || year < 1900 || year > 2030) return null;
            return year;
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function renderGames(games) {
            const container = document.getElementById('gameGrid');
            container.innerHTML = '';

            if (games.length === 0) {
                container.innerHTML = '<div class="no-results">Aucun jeu ne correspond à votre recherche</div>';
                return;
            }

            // Helper function to check if a game is new (including game of the week)
            // Defined at the top of renderGames so it's accessible everywhere
            function isGameNewInAll(game) {
                // Game of the week is always new
                if (window.currentGameId && game.id === window.currentGameId) {
                    return true;
                }
                // Otherwise check new_flag
                return game.new_flag === 'true';
            }

            // Check if we're in search mode (no sections when searching)
            const searchInput = document.getElementById('search-input');
            const genreSelect = document.getElementById('genre-select');
            const developerSelect = document.getElementById('developer-select');
            const systemSelect = document.getElementById('system-select');
            const sortSelect = document.getElementById('sort-select');
            const searchType = document.getElementById('search-type').value;
            const isSearching = (searchInput && searchInput.value) || (genreSelect && genreSelect.value) || (developerSelect && developerSelect.value) || (systemSelect && systemSelect.value) || (searchType === 'week') || (searchType === 'history') || (searchType === 'missing-metadata');

            if (isSearching) {
                // Simple grid layout for search results (no sections)
                const searchGrid = document.createElement('div');
                searchGrid.className = 'section-games';
                searchGrid.style.width = '100%';
                searchGrid.style.display = 'grid';

                // Responsive grid template columns
                if (window.innerWidth <= 768) {
                    searchGrid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(100px, 1fr))';
                    searchGrid.style.gap = '12px';
                    searchGrid.style.marginBottom = '0.3rem';
                } else {
                    searchGrid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(130px, 1fr))';
                    searchGrid.style.gap = '1.2rem';
                    searchGrid.style.marginBottom = '0.5rem';
                }

                // Sort games based on search type and sort selection
                if (searchType === 'week') {
                    const weekGameIds = predictionsData.map(p => p.game_id);
                    // Sort week games by seed number (week number) in descending order (latest first)
                    games.sort((a, b) => {
                        const aIndex = weekGameIds.indexOf(a.id);
                        const bIndex = weekGameIds.indexOf(b.id);
                        return aIndex - bIndex;
                    });
                } else if (sortSelect && (sortSelect.value === 'year-asc' || sortSelect.value === 'year-desc')) {
                    // Group games by year for search results
                    const gamesByYear = {};
                    games.forEach(game => {
                        const year = getGameYear(game);
                        const yearKey = year ? year.toString() : 'Sans année';

                        if (!gamesByYear[yearKey]) {
                            gamesByYear[yearKey] = [];
                        }
                        gamesByYear[yearKey].push(game);
                    });

                    // Sort year keys
                    const sortedYears = Object.keys(gamesByYear).sort((a, b) => {
                        if (a === 'Sans année') return 1; // Put "Sans année" at the end
                        if (b === 'Sans année') return -1;

                        const yearA = parseInt(a);
                        const yearB = parseInt(b);

                        if (sortSelect.value === 'year-asc') {
                            return yearA - yearB; // Ascending order
                        } else {
                            return yearB - yearA; // Descending order
                        }
                    });

                    // Render each year section
                    sortedYears.forEach(yearKey => {
                        // Create year section header
                        const sectionHeader = document.createElement('div');
                        sectionHeader.className = 'section-header';
                        sectionHeader.innerHTML = `<h2>${yearKey}</h2>`;
                        container.appendChild(sectionHeader);

                        // Create section container with full width
                        const sectionContainer = document.createElement('div');
                        sectionContainer.className = 'section-games';
                        sectionContainer.style.width = '100%';
                        sectionContainer.style.display = 'grid';

                        // Responsive grid template columns
                        if (window.innerWidth <= 768) {
                            sectionContainer.style.gridTemplateColumns = 'repeat(auto-fill, minmax(100px, 1fr))';
                            sectionContainer.style.gap = '12px';
                            sectionContainer.style.marginBottom = '0.3rem';
                        } else {
                            sectionContainer.style.gridTemplateColumns = 'repeat(auto-fill, minmax(130px, 1fr))';
                            sectionContainer.style.gap = '1.2rem';
                            sectionContainer.style.marginBottom = '0.5rem';
                        }

                        // Sort games within each year section alphabetically
                        gamesByYear[yearKey].sort((a, b) => {
                            let titleA = getDisplayTitle(a);
                            let titleB = getDisplayTitle(b);

                            // Normalize titles for sorting (move "The" to end)
                            const normalizedA = normalizeTitleForSorting(titleA).toLowerCase();
                            const normalizedB = normalizeTitleForSorting(titleB).toLowerCase();

                            return normalizedA.localeCompare(normalizedB);
                        });

                        // Render games in this year section
                        gamesByYear[yearKey].forEach(game => {
                            const div = document.createElement('div');
                            div.className = 'game';
                            div._gameData = game;

                            const coverSrc = game.coverArt || '/assets/images/placeholder_thumb.png';

                            // Check if game is new (including game of the week)
                            const isNewGame = isGameNewInAll(game);

                            // Add special border and badge if game is new
                            if (isNewGame) {
                                div.classList.add('game-new');
                            }

                            div.innerHTML = `
                        <a href="${game.pageUrl}" class="game-link">
                            <div class="game-cover" style="position:relative;">
                                ${isNewGame ? '<span class="new-badge">NOUVEAU</span>' : ''}
                                <img src="${coverSrc}" alt="${game.title}">
                            </div>
                            <div class="game-title">${getDisplayTitle(game)}</div>
                        </a>
                    `;

                            // Add click handler to set referrer flag and store game ID for back navigation
                            div.querySelector('a').addEventListener('click', function (e) {
                                sessionStorage.setItem('referrerAllGames', '1');
                                sessionStorage.setItem('lastPlayedGame', game.id);
                                addGameToHistory(game.id);
                            });

                            // Tooltip event listeners - only on non-mobile devices
                            if (!isMobileDevice()) {
                                div.addEventListener('mouseenter', (e) => {
                                    showTooltipForItem(div);
                                });
                                div.addEventListener('mouseleave', (e) => {
                                    removeTooltip();
                                });
                            }

                            sectionContainer.appendChild(div);
                        });

                        container.appendChild(sectionContainer);
                    });
                    return;
                } else {
                    if (sortSelect && sortSelect.value === 'latest') {
                        // Sort by added date (newest first)
                        games.sort((a, b) => {
                            // Use added timestamps (newest first)
                            const ta = getAddedTimestamp(a);
                            const tb = getAddedTimestamp(b);
                            if (ta !== -Infinity || tb !== -Infinity) return tb - ta;
                            // Fallback to alphabetical if neither has an added date
                            let titleA = a.title;
                            let titleB = b.title;
                            if (!titleA || titleA === a.id) titleA = capitalizeFirst(a.id);
                            if (!titleB || titleB === b.id) titleB = capitalizeFirst(b.id);

                            // Normalize titles for sorting (move "The" to end)
                            const normalizedA = normalizeTitleForSorting(titleA).toLowerCase();
                            const normalizedB = normalizeTitleForSorting(titleB).toLowerCase();

                            return normalizedA.localeCompare(normalizedB);
                        });
                    } else if (sortSelect && sortSelect.value === 'year-asc') {
                        // Sort by year (ascending - oldest first)
                        games.sort((a, b) => {
                            const yearA = getGameYear(a);
                            const yearB = getGameYear(b);

                            // Games with years come first
                            if (yearA !== null && yearB === null) return -1;
                            if (yearA === null && yearB !== null) return 1;

                            // If both have years, sort by year
                            if (yearA !== null && yearB !== null) {
                                if (yearA !== yearB) return yearA - yearB;
                            }

                            // Fallback to alphabetical for games with same year or no year
                            let titleA = a.title;
                            let titleB = b.title;
                            if (!titleA || titleA === a.id) titleA = capitalizeFirst(a.id);
                            if (!titleB || titleB === b.id) titleB = capitalizeFirst(b.id);

                            const normalizedA = normalizeTitleForSorting(titleA).toLowerCase();
                            const normalizedB = normalizeTitleForSorting(titleB).toLowerCase();

                            return normalizedA.localeCompare(normalizedB);
                        });
                    } else if (sortSelect && sortSelect.value === 'year-desc') {
                        // Sort by year (descending - newest first)
                        games.sort((a, b) => {
                            const yearA = getGameYear(a);
                            const yearB = getGameYear(b);

                            // Games with years come first
                            if (yearA !== null && yearB === null) return -1;
                            if (yearA === null && yearB !== null) return 1;

                            // If both have years, sort by year (descending)
                            if (yearA !== null && yearB !== null) {
                                if (yearA !== yearB) return yearB - yearA;
                            }

                            // Fallback to alphabetical for games with same year or no year
                            let titleA = a.title;
                            let titleB = b.title;
                            if (!titleA || titleA === a.id) titleA = capitalizeFirst(a.id);
                            if (!titleB || titleB === b.id) titleB = capitalizeFirst(b.id);

                            const normalizedA = normalizeTitleForSorting(titleA).toLowerCase();
                            const normalizedB = normalizeTitleForSorting(titleB).toLowerCase();

                            return normalizedA.localeCompare(normalizedB);
                        });
                    } else if (sortSelect && sortSelect.value === 'random') {
                        // Random order for search results
                        shuffleArray(games);
                    } else {
                        // Default alphabetical (treating "The" as suffix)
                        games.sort((a, b) => {
                            let titleA = a.title;
                            let titleB = b.title;
                            if (!titleA || titleA === a.id) titleA = capitalizeFirst(a.id);
                            if (!titleB || titleB === b.id) titleB = capitalizeFirst(b.id);

                            // Normalize titles for sorting (move "The" to end)
                            const normalizedA = normalizeTitleForSorting(titleA).toLowerCase();
                            const normalizedB = normalizeTitleForSorting(titleB).toLowerCase();

                            return normalizedA.localeCompare(normalizedB);
                        });
                    }
                }

                // Render all games in the search grid
                games.forEach(game => {
                    const div = document.createElement('div');
                    div.className = 'game';
                    div._gameData = game;

                    const coverSrc = game.coverArt || '/assets/images/placeholder_thumb.png';

                    // Check if game is new (including game of the week)
                    const isNewGame = isGameNewInAll(game);

                    // Add special border and badge if game is new
                    if (isNewGame) {
                        div.classList.add('game-new');
                    }

                    div.innerHTML = `
                        <a href="${game.pageUrl}" class="game-link">
                            <div class="game-cover" style="position:relative;">
                                ${isNewGame ? '<span class="new-badge">NOUVEAU</span>' : ''}
                                <img src="${coverSrc}" alt="${game.title}">
                            </div>
                            <div class="game-title">${getDisplayTitle(game)}</div>
                        </a>
                    `;

                    // Add click handler to set referrer flag and store game ID for back navigation
                    div.querySelector('a').addEventListener('click', function (e) {
                        sessionStorage.setItem('referrerAllGames', '1');
                        sessionStorage.setItem('lastPlayedGame', game.id);
                        addGameToHistory(game.id);
                    });

                    // Tooltip event listeners - only on non-mobile devices
                    if (!isMobileDevice()) {
                        div.addEventListener('mouseenter', (e) => {
                            showTooltipForItem(div);
                        });
                        div.addEventListener('mouseleave', (e) => {
                            removeTooltip();
                        });
                    }

                    searchGrid.appendChild(div);
                });

                container.appendChild(searchGrid);
            } else {
                // Original sectioned layout for browsing (when not searching)

                // Separate new games from the rest FIRST, before any sorting
                const newGames = games.filter(game => isGameNewInAll(game));
                const otherGames = games.filter(game => !isGameNewInAll(game));

                // Render "nouveautés" section first if there are new games
                if (newGames.length > 0) {
                    // Sort new games by release date (newest first), then alphabetically
                    newGames.sort((a, b) => {
                        // First, sort by added date (newest first)
                        const dateA = a.added ? new Date(a.added).getTime() : 0;
                        const dateB = b.added ? new Date(b.added).getTime() : 0;
                        if (dateB !== dateA) {
                            return dateB - dateA; // Newest first
                        }
                        // If dates are equal or both missing, sort alphabetically
                        let titleA = getDisplayTitle(a);
                        let titleB = getDisplayTitle(b);
                        const normalizedA = normalizeTitleForSorting(titleA).toLowerCase();
                        const normalizedB = normalizeTitleForSorting(titleB).toLowerCase();
                        return normalizedA.localeCompare(normalizedB);
                    });

                    // Create section container for nouveautés first (needed for collapse functionality)
                    const nouveautesContainer = document.createElement('div');
                    nouveautesContainer.className = 'section-games';
                    nouveautesContainer.style.width = '100%';
                    nouveautesContainer.style.display = 'grid';
                    nouveautesContainer.style.overflow = 'hidden';
                    nouveautesContainer.style.transition = 'max-height 0.4s ease-in-out, opacity 0.4s ease-in-out, margin-bottom 0.4s ease-in-out';
                    nouveautesContainer.style.maxHeight = '5000px'; // Large enough to accommodate content
                    nouveautesContainer.style.opacity = '1';

                    // Create "nouveautés" section header (collapsible)
                    const nouveautesHeader = document.createElement('div');
                    nouveautesHeader.className = 'section-header collapsible-header';
                    nouveautesHeader.setAttribute('data-collapsed', 'false');
                    const toggleIcon = document.createElement('span');
                    toggleIcon.className = 'collapse-icon';
                    toggleIcon.textContent = '▼';
                    toggleIcon.style.marginRight = '0.5rem';
                    toggleIcon.style.transition = 'transform 0.3s';
                    toggleIcon.style.display = 'inline-block';
                    const headerTitle = document.createElement('h2');
                    headerTitle.textContent = 'Nouveautés';
                    headerTitle.style.cursor = 'pointer';
                    headerTitle.style.display = 'inline-block';
                    headerTitle.style.margin = '0';
                    headerTitle.style.userSelect = 'none';
                    nouveautesHeader.appendChild(toggleIcon);
                    nouveautesHeader.appendChild(headerTitle);

                    // Add click handler to toggle collapse with smooth animation
                    nouveautesHeader.addEventListener('click', function () {
                        const isCollapsed = nouveautesHeader.getAttribute('data-collapsed') === 'true';
                        nouveautesHeader.setAttribute('data-collapsed', isCollapsed ? 'false' : 'true');
                        if (isCollapsed) {
                            // Expand: show with animation
                            nouveautesContainer.style.display = 'grid';
                            // Measure actual height
                            const actualHeight = nouveautesContainer.scrollHeight;
                            nouveautesContainer.style.maxHeight = '0px';
                            nouveautesContainer.style.opacity = '0';
                            // Use requestAnimationFrame to ensure display is set before animating
                            requestAnimationFrame(() => {
                                requestAnimationFrame(() => {
                                    nouveautesContainer.style.maxHeight = actualHeight + 'px';
                                    nouveautesContainer.style.opacity = '1';
                                    nouveautesContainer.style.marginBottom = '';
                                });
                            });
                            toggleIcon.style.transform = 'rotate(0deg)';
                            // Clean up max-height after animation
                            setTimeout(() => {
                                if (nouveautesHeader.getAttribute('data-collapsed') === 'false') {
                                    nouveautesContainer.style.maxHeight = 'none';
                                }
                            }, 400);
                        } else {
                            // Collapse: hide with animation
                            const currentHeight = nouveautesContainer.scrollHeight;
                            nouveautesContainer.style.maxHeight = currentHeight + 'px';
                            // Force reflow to ensure the height is set
                            nouveautesContainer.offsetHeight;
                            requestAnimationFrame(() => {
                                nouveautesContainer.style.maxHeight = '0px';
                                nouveautesContainer.style.opacity = '0';
                                nouveautesContainer.style.marginBottom = '0';
                                // Hide after animation completes
                                setTimeout(() => {

                // Now render the rest of the games according to sort option
                // Use otherGames instead of games for the remaining games
                const gamesToRender = otherGames;

                // If sorting by random or latest, render a single grid of remaining games
                if (sortSelect && sortSelect.value === 'random') {

                } else if (sortSelect && sortSelect.value === 'latest') {

                    searchGrid.style.width = '100%';
                    searchGrid.style.display = 'grid';

                    const sorted = [...gamesToRender].sort((a, b) => {
                        if (sortSelect.value === 'latest') {
                            const ta = getAddedTimestamp(a);
                            const tb = getAddedTimestamp(b);
                            if (ta !== -Infinity || tb !== -Infinity) return tb - ta;
                        } else if (sortSelect.value === 'year-asc') {
                            const yearA = getGameYear(a);
                            const yearB = getGameYear(b);

                            // Games with years come first
                            if (yearA !== null && yearB === null) return -1;
                            if (yearA === null && yearB !== null) return 1;

                            // If both have years, sort by year
                            if (yearA !== null && yearB !== null) {
                                if (yearA !== yearB) return yearA - yearB;
                            }
                        } else if (sortSelect.value === 'year-desc') {
                            const yearA = getGameYear(a);
                            const yearB = getGameYear(b);

                            // Games with years come first
                            if (yearA !== null && yearB === null) return -1;
                            if (yearA === null && yearB !== null) return 1;

                            // If both have years, sort by year (descending)
                            if (yearA !== null && yearB !== null) {
                                if (yearA !== yearB) return yearB - yearA;
                            }
                        }

                        // Fallback to alphabetical for all cases
                        let titleA = getDisplayTitle(a);
                        let titleB = getDisplayTitle(b);
                        // Normalize titles for sorting (move "The" to end)
                        const normalizedA = normalizeTitleForSorting(titleA).toLowerCase();
                        const normalizedB = normalizeTitleForSorting(titleB).toLowerCase();
                        return normalizedA.localeCompare(normalizedB);

                    sorted.forEach(game => {

                                removeTooltip();
                            });

                    container.appendChild(searchGrid);

                }

                // If sorting by year, group games by year
                if (sortSelect && (sortSelect.value === 'year-asc' || sortSelect.value === 'year-desc')) {
                    // Group games by year
                    const gamesByYear = {};
                    games.forEach(game => {
                        const year = getGameYear(game);
                        const yearKey = year ? year.toString() : 'Sans année';

                        if (!gamesByYear[yearKey]) {
                            gamesByYear[yearKey] = [];
                        }
                        gamesByYear[yearKey].push(game);
                    });

                    // Sort year keys
                    const sortedYears = Object.keys(gamesByYear).sort((a, b) => {
                        if (a === 'Sans année') return 1; // Put "Sans année" at the end
                        if (b === 'Sans année') return -1;

                        const yearA = parseInt(a);
                        const yearB = parseInt(b);

                        if (sortSelect.value === 'year-asc') {
                            return yearA - yearB; // Ascending order
                        } else {
                            return yearB - yearA; // Descending order
                        }
                    });

                    // Render each year section
                    sortedYears.forEach(yearKey => {

                            sectionContainer.style.gap = '12px';
                            sectionContainer.style.marginBottom = '0.3rem';
