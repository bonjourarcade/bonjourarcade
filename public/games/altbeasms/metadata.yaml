announcement_message: "Altered Beast sur Master System est un port 8-bit étonnant du célèbre jeu d'arcade de Sega, où un centurion ressuscité par Zeus doit sauver Athéna des griffes de Neff. Cette version transforme le spectacle massif de l'arcade en une adaptation plus brute et étrange, avec des combats au corps à corps, des boules d'esprit à récupérer et des métamorphoses en créatures mythiques comme le loup-garou, le dragon et le tigre-garou."

