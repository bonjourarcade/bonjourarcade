description: "Dans Chelnov: Atomic Runner sur Sega Genesis, un jeu d'action haletant, incarnez Chelnov, un héros doté d'une armure high-tech créée par son père. Affrontez les sinistres Deathtariens qui ont envahi la Terre et kidnappé sa sœur. Avec son gameplay effréné à défilement forcé, ses niveaux colorés inspirés des civilisations antiques et ses ennemis surgissant de toutes parts, Atomic Runner met vos réflexes et votre stratégie à rude épreuve. Préparez-vous à foncer, sauter et vous frayer un chemin à travers le danger : notre prochain tournoi vous mettra au défi de maîtriser le chaos et de prouver que vous avez l'étoffe d'un Atomic Runner !"
