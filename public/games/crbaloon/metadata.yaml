description: "Dans Crazy Balloon, le but est de guider votre ballon du départ jusqu'à l'arrivée. Si cela paraît simple, détrompez-vous ! Les murs du labyrinthe sont hérissés de pointes qui éclatent les ballons, ces derniers oscillent constamment et, dans les niveaux suivants, Hurricane Man vous projette contre les murs. Attention au temps : la partie est chronométrée ! Lorsque vous perdez vos quatre ballons, la partie est terminée."

