title: Castlevania (Arcade)
developer: Konami
year: 1987
genre: Platform
controls:
- '←↓↑→: Déplacer'
- 'Z: Fouet'
- 'X: Sauter'
to_start: Espace -> Enter

description: "Tous les cent ans, le comte Dracula revient semer la terreur.
  Simon Belmont, héritier d'une célèbre lignée de chasseurs de vampires, pénètre dans
  le vaste château du comte pour briser la malédiction et mettre fin à ses ravages.
  La forteresse est un labyrinthe de salles, de tours, de catacombes et de mécanismes,
  peuplé de monstres et de pièges classiques qui gardent le chemin menant à la salle
  du trône de Dracula."
