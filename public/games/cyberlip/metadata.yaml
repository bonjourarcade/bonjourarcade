title: Cyber-Lip
developer: SNK
year: 1990
genre: Shooter
controls:
- '←↓↑→: Déplacer'
- 'Z: Tirer'
- 'X: Sauter'
- 'C: Choix arme'
to_start: Select -> Start

enable_score: true
hide: yes

added: 2025-09-10
description: "Embarquez dans l'aventure futuriste de Cyber-Lip, un shooter
  captivant de SNK sorti en 1990 qui vous propulse au cœur d'une bataille épique pour
  sauver l'humanité ! Avec son gameplay frénétique et ses graphismes audacieux, vous
  devrez déjouer les plans d'une intelligence artificielle malveillante tout en maniant
  une variété d'armes innovantes. Ce qui rend Cyber-Lip véritablement unique, c'est
  la possibilité de coopérer avec un ami en mode deux joueurs, offrant une expérience
  palpitante et stratégique à partager !"
