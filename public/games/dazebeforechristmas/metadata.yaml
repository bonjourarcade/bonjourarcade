announcement_message: "Entrez dans l'univers enchanteur de Daze Before Christmas,
  un jeu de plateforme captivant développé par Funcom en 1994 qui vous plonge dans
  l'esprit des fêtes avec une touche d'aventure ! Incarnez le célèbre Père Noël et
  parcourez des niveaux magiques pour sauver Noël, en affrontant des ennemis farfelus
  et en collectant des cadeaux tout le long de votre chemin. Avec son ambiance festive
  et ses graphismes colorés, ce titre unique saura ravir les amateurs de jeux rétro
  en quête d'une expérience ludique inoubliable !\n\nJoyeux Noël à tous, et merci
  d'utiliser BonjourArcade. <3"
