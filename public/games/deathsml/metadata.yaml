description: Gilverado est un royaume mystique et singulier, peuplé de magie, de monstres et d'âmes perdues. Récemment, une multitude de créatures démoniaques a fait irruption dans le royaume. Quatre jeunes filles, enlevées au monde des humains des années auparavant et élevées pour devenir des sorcières aux pouvoirs prodigieux, ont entrepris d'en découvrir la source et d'y mettre un terme.

