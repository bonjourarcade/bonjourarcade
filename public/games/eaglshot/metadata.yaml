to_start: "Z ou X"
announcement_message: "Développé et publié par Sammy en 1994 sur le système d'arcade SSV, Eagle Shot Golf est une simulation de golf qui privilégie une approche relativement traditionnelle du sport. Le joueur choisit parmi quatre golfeurs possédant des caractéristiques différentes, puis doit gérer plusieurs paramètres avant chaque coup, notamment le club utilisé, la posture, la direction, la puissance et le moment de l'impact. La direction et la force du vent influencent également la trajectoire de la balle et doivent être prises en compte pour atteindre le green dans de bonnes conditions. Le jeu propose trois niveaux adaptés aux joueurs débutants, amateurs et expérimentés, ainsi qu'un parcours de dix-huit trous et des parties pouvant réunir jusqu'à quatre participants à tour de rôle. Eagle Shot Golf se distingue notamment par l'utilisation de golfeurs numérisés et par ses vues aériennes du parcours, qui permettent d'évaluer la position de la balle et les obstacles avant de préparer le coup suivant. La borne d'origine pouvait être configurée pour utiliser un trackball ou un joystick, une particularité qui rapproche son interface des jeux de golf d'arcade spécialisés de la même période. Moins spectaculaire que les jeux d'action généralement associés au matériel SSV, Eagle Shot Golf montre une autre facette du catalogue de Sammy, avec une adaptation méthodique du golf centrée sur la préparation et l'exécution précise de chaque coup."
