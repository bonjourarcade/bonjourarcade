title: Flicky
developer: Sega
year: 1984
genre: Platform, Cute
controls:
- '←↓↑→: Déplacer'
- 'Z: Sauter/Lancer'
to_start: Select -> Start
announcement_message: Ceux qui ont déjà joué à Sonic 3D Blast en 1996 seront 
  peut-être familiers avec les Flickies, ces petits oiseaux qui cherchent à 
  retrouver leur maison. Or, c'est dans Flicky qu'ils sont apparus pour la 
  première fois, en 1984. Méfiez-vous des chattons, et déjouez-les en leur 
  lançant des pots de fleur. Ce jeu mignon et simple en apparence vous charmera 
  rapidement, j'en suis certain!

hide: yes

