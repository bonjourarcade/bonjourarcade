announcement_message: Ceux qui ont déjà joué à Sonic 3D Blast en 1996 seront peut-être familiés avec les Flickies, ces petits oiseaux qui cherchent à retrouver leur maison. Or, c'est Flicky, en 1984. Méfiez-vous des chattons, et déjouez-les en leur lançant des pots de fleur. Ce jeu mignon et simple en apparence vous charmera rapidement, j'en suis certain!

