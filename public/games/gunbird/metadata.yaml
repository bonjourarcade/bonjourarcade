added: 2025-08-24
description: "Venez découvrir Gunbird, le shooter emblématique de Psikyo
  sorti en 1994, qui vous propulsera dans un monde de magie et d'aventure fantastique
  ! Pilotez des avions stylisés tout en collectant des power-ups détonants et en affrontant
  des boss mémorables dans des niveaux riches en couleurs et en défis. Avec son gameplay
  énergique, son ambiance unique et ses personnages attachants, Gunbird est une véritable
  ode aux shoot 'em up qui saura captiver les amateurs de sensations fortes !"
