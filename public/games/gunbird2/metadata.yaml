title: Gunbird 2
developer: Psikyo
year: 1998
genre: Shooter, co-op
controls:
- '←↓↑→: Déplacer'
- 'Z: Tirer/Charger'
- 'X: Bombe'
- 'C: Sub-weapon'
to_start: Select -> Start

enable_score: true
hide: yes

added: 2025-07-31
announcement_message: "Envolez-vous dans l'univers fantastique de Gunbird 2, un shooter
  palpitant de Psikyo sorti en 1998 qui vous promet des heures de plaisir intense
  ! Pilotez des personnages uniques, chacun avec des armes spéciales et des attaques
  dévastatrices, tout en affrontant des vagues d'ennemis dans des niveaux colorés
  et remplis d'action. Avec son système de combo dynamique et ses boss épiques, Gunbird
  2 offre une expérience de jeu captivante qui ravira les amateurs de sensations fortes
  et de défis !"
