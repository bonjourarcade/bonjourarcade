title: Gunstar Heroes
developer: Treasure
year: 1993
genre: Shooter, Platform, co-op
controls:
  - "Entrée = démarrer"
  - "← → ↑ ↓ = se déplacer et viser"
  - "Z = changer ou combiner l'arme"
  - "X = tirer"
  - "C = sauter"
  - "↓ + C = glissade"

to_start: "Entrée"
announcement_message: "Gunstar Heroes sur Mega Drive est le coup de tonnerre de Treasure, un run and gun coopératif où les armes se combinent, les boss explosent en modules improbables et le score récompense autant la survie propre que la capacité à rester élégant dans un chaos total."

