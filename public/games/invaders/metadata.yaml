title: Space Invaders
developer: Taito
year: 1978
genre: Shooter
controls:
  - "←↓↑→: Déplacer"
  - "Z: Tirer"

to_start: Espace, puis Enter

enable_score: true
hide: yes
announcement_message: "La Terre est attaquée par des rangées d'extraterrestres bombardiers, et vous devez la défendre ! Les rangées d'extraterrestres apparaissent en haut de l'écran, et vous contrôlez un canon laser en bas. Votre objectif est de marquer des points en tirant sur les extraterrestres avant qu'ils n'atterrissent. Les extraterrestres avancent d'avant en arrière, et à chaque fois que le bord de l'écran est atteint, une rangée supplémentaire descend. Abattez-les tous pour passer au niveau suivant (plus difficile), mais attention, si l'un d'eux atterrit, la partie est perdue. De temps en temps, une soucoupe volante apparaît en haut de l'écran ; tirez dessus pour gagner des points bonus. Juste au-dessus de votre canon laser se trouvent quatre boucliers ; ils vous protègent des bombes extraterrestres, mais bloquent aussi vos propres tirs. Vous commencez la partie avec un nombre limité de canons laser, et si tous sont détruits, la partie est terminée."

added: 2025-09-10
