added: 2025-07-31
announcement_message: "Si vous vous promenez dans les centres d'arcade de Tokyo, il est fort à parier que vous vous retrouverez nez à nez avec Ketsui, un jeu intense et stimulant comme on en voit rarement en Occident. Les mécaniques sont simples: évitez les balles ennemies, détruisez tout ce qui bouge avec vos deux options de tir, et utilisez vos bombes pour vous frayer un chemin. Une twist amusante: vous recevrez un bonus proportionnel à votre distance des ennemis que vous détruisez. Un excellent jeu pour entrer en \"flow state\" rapidement!"
