description: "Entrez dans le monde enchanteur de Kickle Cubicle, un jeu de
  puzzle captivant d'Irem sorti en 1988 sur NES ! Dans cette aventure colorée, vous
  incarnez le brave Kickle, qui doit capturer des ennemis en les transformant en blocs
  de glace pour les utiliser stratégiquement et résoudre des énigmes délicates. Avec
  ses graphismes adorables et ses défis ingénieux, Kickle Cubicle vous promet des
  heures de réflexion amusante et un voyage mémorable dans un univers plein de charme
  !"

