title: League Bowling
developer: SNK
year: 1990
genre: Sports
controls:
- '←↓↑→: Déplacer'
- 'Z: Lancer'
to_start: Select -> Start
description: "Avant Wii Sports, on pouvait compter sur SNK pour livrer des jeux de sports fantastiques sur la borne Neo Geo. Voici League Bowling, un titre culte qui testera votre précision et votre sens du timing. Ce classique de l'arcade se distingue par ses graphismes colorés et ses animations humoristiques typiques des années 1990. Il propose une prise en main immédiate à travers différents modes de jeu, offrant une expérience rétro simple et redoutablement addictive."

