description: MEGA MAN! C'est ici, en 1987, qu'est née une nouvelle 
  icône du monde des jeux vidéo. Son innovation principale est que vous 
  choisissez l'ordre dans lequel compléter les niveaux. À la fin de chaque 
  niveau, vous trouverez une nouvelle arme qui est la faiblesse d'un des boss 
  restants. Est-ce que Mega Man sauvera la planète des machinations du Dr. Wily?
  À vous de voir!

