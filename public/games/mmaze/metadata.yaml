title: Märchen Maze
developer: N.H. System
year: 1988
genre: Shooter, Platform
controls:
- '←↓↑→: Mouvement'
- 'Z: Bulle'
- 'X: Sauter'
to_start: Espace -> Enter

# Message d'annonce personnalisé pour la newsletter
# Ce message apparaîtra en haut de l'email et des webhooks
description: "Aux commandes d'une jeune fille nommée Alice, le joueur doit
  traverser les neuf niveaux du jeu en évitant les ennemis et les chutes. Alice peut
  souffler de puissantes bulles pour repousser ses ennemis et les frapper suffisamment
  de fois pour les faire tomber de la plateforme. Il s'agit de la première adaptation
  japonaise en jeu vidéo des Aventures d'Alice au pays des merveilles de Lewis Carroll!"

hide: yes

