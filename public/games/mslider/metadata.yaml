title: "Monster Slider"
developer: "DATT Japan"
year: 1997
genre: "Puzzle / Falling blocks"
controls:
  - "Entrée = Pause"
  - "← → = déplacer les blocs"
  - "↓ = accélérer la chute"
  - "Z = faire pivoter les blocs"
  - "X = inverser l'inclinaison du terrain"
  - "C = utiliser l'action spéciale"
to_start: "Espace + Entrée ou Z ou X"
announcement_message: "Développé par DATT Japan et publié par Visco en arcade en 1997, Monster Slider est un jeu de puzzle compétitif construit autour d'une variation originale du principe des jeux de blocs tombants. Des groupes de blocs colorés descendent dans une zone de jeu et disparaissent lorsqu'au moins trois éléments de même couleur sont réunis. Sa mécanique centrale repose sur l'inclinaison du terrain : le joueur peut modifier la pente du plateau afin de faire glisser les blocs déjà posés vers la gauche ou vers la droite, ouvrant ainsi de nouvelles possibilités de combinaisons et de réactions en chaîne. Cette mobilité permanente du contenu du plateau oblige à penser les placements non seulement en fonction de leur position immédiate, mais aussi de la manière dont l'ensemble pourra se réorganiser après un changement d'inclinaison. Les enchaînements permettent d'envoyer des blocs gênants sur le terrain adverse, tandis que les différents personnages disposent de capacités particulières qui influencent le déroulement des affrontements. Le jeu propose un mode solo structuré autour d'une succession d'adversaires ainsi qu'un mode versus pour deux joueurs simultanés. Monster Slider avait d'abord été publié sur Sega Saturn quelques mois auparavant, avant d'être adapté au matériel SSV en août 1997. Cette version arcade conserve le principe fondamental du jeu tout en simplifiant certains éléments de la version domestique, notamment sa structure et sa présentation. Avec son système de terrain inclinable, Monster Slider se distingue des nombreux puzzle games compétitifs de la période en faisant du déplacement des blocs déjà installés une mécanique aussi importante que leur chute initiale."
