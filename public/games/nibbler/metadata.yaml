added: 2025-09-16
announcement_message: "Préparez-vous à mordre à pleines dents dans Nibbler, un jeu
  d'arcade palpitant de Rock-Ola sorti en 1982 qui vous fera frémir d'excitation !
  Dans ce puzzle-action, vous incarnez un serpent qui doit dévorer des pastèques tout
  en évitant les obstacles pour grandir et atteindre des scores vertigineux. Avec
  son gameplay addictif et son défi croissant, Nibbler est le parfait mélange de stratégie
  et de reflexes qui saura captiver les amateurs de sensations fortes !"
