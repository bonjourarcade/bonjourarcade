title: Pac-Land
developer: Namco
year: 1984
genre: Platform, Cute
added: 2026-03-12
controls:
  - "←→: Mouvement"
  - "→→: Courir!"
  - "Z: Sauter"

to_start: Espace, puis Enter
announcement_message: "Avec ce titre culte de 1984, Pac-Man s’essaie au jeu de plateforme et pose les bases du genre un an avant le légendaire Super Mario Bros., dont il fut l'inspiration directe. Guidez notre héros dans un monde coloré au style \"cartoon\" pour escorter une fée vers son royaume tout en échappant à l'infatigable bande de Blinky. Entre son défilement horizontal novateur et son ambiance joyeuse, cette conversion arcade est une pièce d'histoire essentielle qui a redéfini l'avenir du jeu d'aventure."
