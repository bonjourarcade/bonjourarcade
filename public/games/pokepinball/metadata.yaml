title: Pokémon Pinball
developer: Jupiter, HAL Laboratory
year: 1999
genre: Pinball
controls:
  - "A: Paddle gauche"
  - "K: Paddle droit, OK"
  - "J: Tilt, Retour"
  - "S: Tilt"
  - "W,A,S,D: Directions de menu"
  - "Espace: Tilt"
  - "Enter: Start"
  - "[Guide visuel (image)](/games/pokepinball/controls.jpg)"

announcement_message: "Découvrez une toute nouvelle façon d'attraper des Pokémon : en jouant au flipper ! Touchez les cibles avec votre Poké Ball pour capturer et faire évoluer des Pokémon. Plus vous êtes performant, plus les Pokémon que vous trouverez seront rares. Chaque Pokémon capturé est automatiquement enregistré dans votre Pokédex. Parviendrez-vous à tous les attraper ?"

to_start: Enter


