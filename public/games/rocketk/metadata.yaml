- 'X: Sauter'
- 'C: Épée/Jet Pack'
description: "Préparez-vous à vivre une aventure palpitante avec Rocket Knight
  Adventures, un chef-d'œuvre de Konami sorti en 1993 qui allie action et plateforme
  de manière inédite ! Incarnez un opossum en armure, équipé d'un jetpack, pour explorer
  des niveaux fascinants remplis d'énigmes ingénieuses et d'ennemis farceurs, tout
  en profitant d'une direction artistique charmante et colorée. Ce jeu emblématique
  se distingue par son mélange unique de mécanique de vol et de combat, vous garantissant
  des heures de plaisir ininterrompu !"
