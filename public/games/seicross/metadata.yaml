announcement_message: "Évadez-vous dans l'univers futuriste de Seicross, un shooter
  palpitant de Nichibutsu sorti en 1984 qui vous fera vivre des sensations fortes
  à chaque virage ! Prenez le contrôle de votre moto volante et affrontez des ennemis
  acharnés tout en naviguant à travers des environnements variés, le tout avec une
  bande-son entraînante qui vous plonge dans l'action. Ce jeu unique vous propose
  un mélange de vitesse et de stratégie, où chaque course est une véritable aventure
  à vivre entre amis ou en solo !"
