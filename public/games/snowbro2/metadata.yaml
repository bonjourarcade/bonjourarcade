description: "Snow Bros. 2: With New Elves sur MAME est une dernière salve Toaplan en mode Bubble Bobble sous amphétamines, un jeu de plateforme fixe où l'on transforme les ennemis en boules de neige avant de les catapulter pour nettoyer l'écran, faire grimper le score et transformer chaque petit étage en carnage mignon mais très sérieux."

