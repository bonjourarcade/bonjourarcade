title: "Survival Arts"
developer: "Scarab"
year: 1993
genre: "Fighting"
controls:
  - "Entrée = Pause"
  - "← ↑ ↓ → = se déplacer / sauter / s'accroupir"
  - "Z = coup de poing faible"
  - "X = coup de poing moyen"
  - "C = coup de poing fort"
  - "A = coup de pied faible"
  - "S = coup de pied moyen"
  - "D = coup de pied fort"
to_start: "Espace + Entrée"
announcement_message: "Développé par Scarab et publié par Sammy en 1993, Survival Arts est un jeu de combat en un contre un conçu pour le système d'arcade SSV. Le jeu met en scène huit combattants engagés dans un tournoi organisé par Dantel, maître du Survival Arts, chacun disposant de ses propres techniques spéciales et motivations. Son système de combat repose sur une configuration à six boutons comprenant trois niveaux de coups de poing et trois niveaux de coups de pied, auxquels s'ajoutent projections, attaques spéciales et techniques propres à chaque personnage. Certains combattants se distinguent également par l'utilisation d'armes ou d'attaques à distance, comme les armes à feu de Gunner et Mongo ou les techniques armées de Hiryu et Tasha. Survival Arts adopte une présentation fondée sur des acteurs numérisés, une technique devenue particulièrement visible dans les jeux de combat du début des années 1990, mais l'associe à des décors et effets graphiques caractéristiques du matériel SSV. Les affrontements peuvent se terminer par des attaques particulièrement violentes capables de provoquer des animations spécifiques de défaite, tandis que plusieurs personnages disposent de mouvements permettant de projeter, électrocuter, brûler ou démembrer leur adversaire. Derrière cette présentation spectaculaire se trouve un système relativement traditionnel de jeu de combat en 2D, avec gestion des distances, attaques hautes et basses, projectiles et combinaisons de directions et de boutons pour exécuter les coups spéciaux. Sorti en octobre 1993, Survival Arts fait partie des premiers titres développés par Scarab et demeure l'un des jeux les plus reconnaissables du catalogue SSV grâce à son utilisation intensive d'images numérisées et à son esthétique très représentative de la période."
