title: Tetris (Game Boy)
developer: Nintendo
year: 1989
genre: Puzzle
enable_score: true
announcement_message: "Plongez dans l'univers addictif de Tetris, le classique intemporel de Nintendo sorti en 1989 sur Game Boy ! Empilez les blocs colorés dans une danse stratégique sans fin et découvrez comment chaque partie devient un défi palpitant pour votre esprit. Avec son gameplay simple mais incroyablement profond, Tetris continue de captiver des générations de joueurs, prouvant que parfois, moins c'est vraiment plus !"
