announcement_message: "Plongez dans l'univers décalé de Toki, un jeu de plateforme et de tir incontournable développé par Tad en 1989 ! Incarnez un homme transformé en singe courageux, armé d'une incroyable capacité à cracher des boules de feu, et partez à la rescousse de votre bien-aimée en naviguant à travers des niveaux remplis d'ennemis loufoques et de boss mémorables. La magie de Toki réside dans son mélange unique d'humour et d'action frénétique, faisant de chaque partie une aventure palpitante pleine de surprises !"

