title: "Twin Eagle II - The Rescue Mission"
developer: "Seta"
year: 1994
genre: "Shoot 'em up / Vertical shooter"
controls:
  - "Entrée = Pause"
  - "← ↑ ↓ → = déplacer l'hélicoptère"
  - "Z = canon / tir air-air"
  - "X = roquettes / tir air-sol"
  - "C = arme spéciale"
to_start: "Espace + Entrée"
description: "Développé par Seta et sorti en arcade en février 1994, Twin Eagle II - The Rescue Mission est un shoot 'em up à défilement vertical conçu pour le système SSV et faisant suite à Twin Eagle, paru en 1988. Un ou deux joueurs contrôlent simultanément des hélicoptères de combat équipés de trois types d'attaque complémentaires : un canon destiné principalement aux cibles aériennes, des roquettes permettant de détruire les unités et installations au sol, et une puissante arme spéciale capable d'éliminer rapidement les ennemis et projectiles présents à l'écran. Le jeu est organisé en trois grandes missions, chacune divisée en plusieurs zones dont le joueur peut choisir l'ordre au début du stage. Cette structure permet d'alterner entre des secteurs dominés par les combats aériens et d'autres où la destruction des objectifs terrestres devient essentielle. Certaines zones adoptent une perspective inclinée donnant davantage de profondeur aux villes, installations militaires et autres environnements traversés. De nombreux bâtiments peuvent être détruits et dissimulent parfois des véhicules transportant des améliorations d'armement ou des bonus de points, encourageant le joueur à attaquer le décor plutôt que de se concentrer uniquement sur les ennemis immédiats. Chaque secteur se termine par un boss, tandis que la dernière mission ajoute un affrontement supplémentaire avant la conclusion du jeu. Twin Eagle II se distingue également par son utilisation d'un processeur ST010 auxiliaire sur certaines versions du matériel, ainsi que par une présentation mêlant sprites détaillés, effets de mise à l'échelle et décors cherchant un rendu plus réaliste que celui de nombreux shoot 'em up contemporains. Avec son système séparant clairement les attaques aériennes et terrestres, ses parcours partiellement sélectionnables et son environnement largement destructible, Twin Eagle II propose une approche inhabituelle du shoot 'em up vertical traditionnel."
