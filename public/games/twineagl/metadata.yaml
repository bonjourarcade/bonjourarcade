title: "Twin Eagle - Revenge Joe's Brother"
developer: "Seta"
year: 1988
genre: "Shoot 'em up / Vertical shooter"
controls:
  - "Entrée = Pause"
  - "← ↑ ↓ → = déplacer l'hélicoptère"
  - "Z = tirer"
  - "X = bombe"
to_start: "Espace + Entrée"
description: "Développé par Seta et sorti en arcade en 1988, Twin Eagle - Revenge Joe's Brother est un shoot 'em up à défilement vertical dans lequel un ou deux joueurs contrôlent simultanément des hélicoptères de combat. L'action alterne entre des secteurs terrestres et maritimes remplis de véhicules, de fortifications et d'hélicoptères ennemis, et des séquences consacrées à des affrontements contre des formations d'avions de chasse. Le système de jeu repose sur deux commandes principales : un tir frontal destiné à éliminer les cibles aériennes et terrestres, et un stock limité de bombes permettant de nettoyer une zone dangereuse ou d'infliger rapidement d'importants dégâts. Plusieurs types de bonus peuvent être récupérés au cours des stages afin d'augmenter le nombre de projectiles tirés, leur portée, la vitesse de déplacement de l'hélicoptère ou la réserve de bombes. La disposition d'une grande partie des forces terrestres reste fixe d'une partie à l'autre, favorisant progressivement la mémorisation des stages, tandis que certaines vagues aériennes disposent d'un comportement moins prévisible. Le jeu se caractérise par une difficulté élevée, une forte densité d'ennemis et la nécessité de maintenir une puissance de feu suffisante pour suivre l'augmentation progressive de la pression offensive. Twin Eagle se distingue également par sa bande sonore rock, qui accompagne notamment certaines séquences de combat aérien et utilise exceptionnellement des parties vocales pour un jeu d'arcade de cette période. Premier épisode de la série, il établit plusieurs éléments que Seta reprendra six ans plus tard dans Twin Eagle II, tout en appartenant à une génération de matériel antérieure au système SSV."
