title: "Ultra X Weapons"
developer: "Seta"
year: 1995
genre: "Shoot 'em up / Vertical shooter"
controls:
  - "Entrée = Pause"
  - "← ↑ ↓ → = déplacer le vaisseau"
  - "Z = tirer"
  - "X = lancer une mine"
  - "C = Ultra Bomb"
to_start: "Espace + Entrée"
description: "Développé par Seta et publié par Banpresto en 1995 sur le système d'arcade SSV, Ultra X Weapons est un shoot 'em up à défilement vertical basé sur la franchise japonaise Ultraman de Tsuburaya Productions. Connu au Japon sous le titre Ultra Keibitai, le jeu place le joueur non pas directement aux commandes d'un Ultraman, mais aux commandes des appareils utilisés par les différentes équipes de défense apparues dans les séries télévisées, de Ultraman à Ultraman 80. Sept appareils sont disponibles et possèdent des caractéristiques différentes en matière de vitesse, de puissance et de couverture de tir. Le système de combat utilise trois attaques distinctes : un tir principal pouvant être amélioré au moyen de bonus, des mines particulièrement puissantes qui peuvent être projetées dans différentes directions et restent temporairement en place, et une Ultra Bomb en quantité limitée. Cette dernière fait intervenir l'Ultra Warrior associé au vaisseau sélectionné, qui traverse l'écran en attaquant les ennemis tout en rendant momentanément le joueur invincible. Le jeu comprend sept stages inspirés des différentes séries classiques d'Ultraman et oppose régulièrement le joueur à leurs monstres et extraterrestres les plus connus. Les quatre premiers stages peuvent être abordés dans l'ordre choisi par le joueur, tandis que les trois derniers forment une progression fixe jusqu'à l'affrontement final. Les mines occupent une place particulièrement importante dans le système de jeu : jusqu'à huit peuvent être présentes simultanément à l'écran et leur placement permet d'anticiper l'arrivée des ennemis ou d'infliger rapidement de lourds dégâts aux cibles imposantes. Jouable à deux simultanément, Ultra X Weapons associe ainsi les conventions du shoot 'em up vertical à une utilisation particulièrement fidèle de l'univers visuel et musical des premières séries Ultraman, tout en constituant l'une des productions les plus distinctives du catalogue SSV."
