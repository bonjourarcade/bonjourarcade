title: UndeadLine
developer: T&E Soft
year: 1991
added: 2025-11-10
genre: Shooter
hide: yes
to_start: Start
controls:
- '←↓↑→: Déplacer'
- 'Z: Boule piquante'
- 'X: Tirer'
- 'C: Bouclier'
announcement_message: "Préparez-vous à plonger dans l'univers saisissant d'Undeadline,
  un shooter captivant de T&E Soft sorti en 1991 ! Dans ce jeu, vous devrez faire
  face à des hordes de zombies menaçants tout en naviguant à travers des niveaux innovants
  où le temps est un facteur clé, ajoutant une dimension stratégique à l'action frénétique.
  Avec son ambiance unique et son gameplay addictif, Undeadline vous promet une expérience
  palpitante où chaque seconde compte pour survivre !"
