title: "Ys: The Vanished Omens"
developer: "SEGA / Nihon Falcom"
year: 1988
genre: "Action-RPG"
controls:
  - "Z ou X = démarrer"
  - "Entrée = pause"
  - "← → ↑ ↓ = se déplacer / naviguer dans les menus"
