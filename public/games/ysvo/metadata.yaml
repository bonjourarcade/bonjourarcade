  - "Z = annuler / revenir en arrière"
to_start: "Z ou X"
announcement_message: "Adaptation Master System du premier Ys de Nihon Falcom, The Vanished Omens envoie le jeune aventurier Adol Christin sur l'île d'Esteria, à la recherche des six livres d'Ys et des secrets d'un ancien royaume disparu. C'est un action-RPG rapide et direct, construit autour du fameux bump combat : pas de bouton d'attaque, on combat en percutant les ennemis avec le bon angle, en gérant son équipement, son niveau, ses soins et ses déplacements. La version Master System donne au jeu une forme claire et accessible, avec sauvegarde intégrée, exploration lisible, villages, donjons, boss et cette cadence très particulière des premiers Ys, entre RPG classique et action immédiate. Sobre, efficace et encore très jouable, c'est une belle porte d'entrée vers une série qui deviendra l'un des grands noms du RPG japonais."
