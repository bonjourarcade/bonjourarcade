<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - BonjourArcade</title>
    <meta name="description" content="Profil joueur BonjourArcade.">
    <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/profil.css">
    <script async src="/assets/js/analytics.js"></script>
</head>

<body>
    <header class="profil-header">
        <div class="profil-header-inner">
            <a class="profil-header-logo" href="/" aria-label="Retour a l'accueil BonjourArcade">
                <img src="/assets/images/bonjourarcade-logo.png" alt="BonjourArcade">
            </a>

            <div class="profil-header-actions">
                <div id="profil-auth-status" class="profil-auth-status" aria-live="polite">
                    <span id="profil-auth-dot" class="profil-auth-dot" aria-hidden="true"></span>
                    <span id="profil-auth-text">Non connecte</span>
                </div>
                <button id="profil-auth-button" class="profil-auth-button" type="button">Connexion</button>
                <div class="theme-toggle-wrapper" style="position: relative;" id="dropdown-root" data-preset="profil"></div>
            </div>
        </div>
    </header>

    <main class="profil-main">
        <div id="profil-loading" class="profil-state loading">Chargement du profil...</div>
        <div id="profil-error" class="profil-state error" style="display:none;"></div>
        <div id="profil-content" style="display:none;">
            <div class="profil-card">
                <div class="profil-cover"></div>
                <div class="profil-card-body">
                    <div class="profil-avatar-wrap">
                        <div class="profil-avatar">
                            <img id="profil-avatar-img" src="" alt="Avatar" style="display:none;">
                            <span id="profil-avatar-fallback" class="profil-avatar-fallback">👤</span>
                            <div class="profil-avatar-edit-hint">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                            </div>
                        </div>
                    </div>
                    <div class="profil-info">
                        <h1 id="profil-display-name" class="profil-name"></h1>
                        <p id="profil-member-since" class="profil-meta"></p>
                        <div class="profil-actions-row">
                            <button id="profil-edit-toggle" class="profil-edit-toggle" type="button">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                                Modifier
                            </button>
                            <button id="profil-logout" class="profil-logout" type="button" style="display:none;">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                                Déconnexion
                            </button>
                        </div>
                        <div id="profil-edit-name" class="profil-edit-name" style="display:none;">
                            <form id="profil-name-form">
                                <input id="profil-name-input" class="profil-name-input" type="text" maxlength="40" autocomplete="nickname">
                                <button type="submit" hidden></button>
                            </form>
                            <p id="profil-name-status" class="profil-name-status" aria-live="polite"></p>
                        </div>
                    </div>
                </div>
                <div id="profil-avatar-actions" class="profil-avatar-actions" style="display:none;">
                    <input id="profil-avatar-url" type="text" placeholder="URL de l'image (https://...)" class="profil-avatar-url-input">
                    <div class="profil-avatar-actions-btns">
                        <button id="profil-avatar-set-url" class="profil-avatar-btn" type="button" title="Utiliser cette URL">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        </button>
                        <button id="profil-avatar-reset" class="profil-avatar-btn" type="button" title="Revenir a l'avatar SSO">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                        </button>
                        <button id="profil-avatar-delete" class="profil-avatar-btn profil-avatar-btn--danger" type="button" title="Supprimer l'avatar">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </div>
                    <div class="profil-banner-row">
                        <label class="profil-banner-label">
                            <span class="profil-banner-label-text">Bannière</span>
                            <input type="color" id="profil-banner-picker" class="profil-banner-picker" value="#0b7a63">
                        </label>
                        <button id="profil-banner-reset" class="profil-avatar-btn" type="button" title="Réinitialiser la bannière">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                        </button>
                    </div>
                    <div id="profil-edit-footer" class="profil-edit-footer" style="display:none;">
                        <button id="profil-name-save" class="profil-name-save" type="button">Enregistrer</button>
                        <button id="profil-name-cancel" class="profil-name-cancel" type="button">Annuler</button>
                    </div>
                </div>
            </div>

            <div class="profil-stats" id="profil-stats">
                <div class="profil-stat-card">
                    <span class="profil-stat-icon">🎮</span>
                    <span class="profil-stat-value" id="profil-stat-games">—</span>
                    <span class="profil-stat-label">Jeux joués</span>
                </div>
                <div class="profil-stat-card">
                    <span class="profil-stat-icon">🏆</span>
                    <span class="profil-stat-value" id="profil-stat-scores">—</span>
                    <span class="profil-stat-label">Scores</span>
                </div>
                <div class="profil-stat-card">
                    <span class="profil-stat-icon">👑</span>
                    <span class="profil-stat-value" id="profil-stat-top">—</span>
                    <span class="profil-stat-label">Top 1</span>
                </div>
            </div>

            <div class="profil-favorites-card">
                <div class="profil-scores-card-header profil-collapsible-header" data-target="profil-fav-body-wrap">
                    <h2 class="profil-section-title">Mes jeux favoris</h2>
                    <span class="profil-collapse-icon">▼</span>
                </div>
                <div id="profil-fav-body-wrap" class="profil-collapsible-body">
                    <div id="profil-fav-loading" class="section-state loading">Chargement des favoris...</div>
                    <div id="profil-fav-empty" class="section-state empty" style="display:none;">Aucun favori pour le moment</div>
                    <div id="profil-fav-grid" class="profil-fav-grid" style="display:none;"></div>
                </div>
            </div>

            <div class="profil-scores-card">
                <div class="profil-scores-card-header profil-collapsible-header" data-target="profil-scores-body-wrap">
                    <h2 class="profil-section-title">Meilleurs scores</h2>
                    <span class="profil-collapse-icon">▼</span>
                </div>
                <div id="profil-scores-body-wrap" class="profil-collapsible-body">
                    <div id="profil-scores-loading" class="section-state loading">Chargement des scores...</div>
                    <div id="profil-scores-empty" class="section-state empty" style="display:none;">Aucun score pour le moment</div>
                    <div class="profil-scores-table-wrap">
                        <table class="profil-scores-table" id="profil-scores-table" style="display:none;">
                            <thead>
                                <tr>
                                    <th data-sort="rank" class="sortable">Rang</th>
                                    <th data-sort="game" class="sortable">Jeu</th>
                                    <th data-sort="score" class="sortable">Score</th>
                                    <th data-sort="date" class="sortable">Date</th>
                                    <th>Preuve</th>
                                </tr>
                            </thead>
                            <tbody id="profil-scores-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="proof-modal" class="proof-modal" role="dialog" aria-modal="true" aria-label="Preuve du score">
        <div class="proof-modal-content">
            <button id="proof-modal-close" class="proof-modal-close" type="button" aria-label="Fermer">×</button>
            <div id="proof-modal-loader" class="proof-modal-loader" role="status" aria-live="polite">
                <span class="proof-modal-spinner" aria-hidden="true"></span>
                <span class="proof-modal-loader-text">Chargement de la preuve...</span>
            </div>
            <img id="proof-modal-image" src="" alt="Image de preuve">
        </div>
    </div>

    <style>
        .profil-toast-stack {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }
        .profil-toast-item {
            background: rgba(0, 0, 0, 0.88);
            color: #fff;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            pointer-events: auto;
            animation: profil-toast-in 180ms ease-out forwards;
            backdrop-filter: blur(6px);
        }
        .profil-toast-item.is-success {
            border: 1px solid #2ecc71;
        }
        .profil-toast-item.is-error {
            border: 1px solid #e74c3c;
        }
        .profil-toast-item.is-info {
            border: 1px solid #3498db;
        }
        @keyframes profil-toast-in {
            from { opacity: 0; transform: translateY(12px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .proof-btn {
            border: 1px solid var(--accent);
            color: var(--accent-strong);
            background: var(--surface-strong);
            border-radius: 8px;
            padding: 5px 9px;
            cursor: pointer;
        }
        .proof-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            z-index: 140;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .proof-modal-content {
            max-width: min(95vw, 1000px);
            max-height: 90vh;
            background: #111;
            border-radius: 12px;
            border: 1px solid #2f2f2f;
            padding: 12px;
            position: relative;
        }
        #proof-modal.is-loading .proof-modal-content,
        #proof-modal.is-error .proof-modal-content {
            width: min(92vw, 980px);
            min-height: min(72vh, 640px);
        }
        @media (max-width: 680px) {
            #proof-modal.is-loading .proof-modal-content,
            #proof-modal.is-error .proof-modal-content {
                width: min(94vw, 520px);
                min-height: min(56vh, 460px);
            }
        }
        #proof-modal .proof-modal-loader {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            color: #f1f1f1;
            background: rgba(8, 8, 8, 0.68);
            border-radius: 12px;
            z-index: 1;
        }
        #proof-modal.is-loading .proof-modal-loader,
        #proof-modal.is-error .proof-modal-loader {
            display: flex;
        }
        #proof-modal .proof-modal-spinner {
            width: 34px;
            height: 34px;
            border-radius: 999px;
            border: 3px solid rgba(255, 255, 255, 0.32);
            border-top-color: #ffffff;
            animation: proof-modal-spin 0.8s linear infinite;
        }
        #proof-modal .proof-modal-loader-text {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.01em;
        }
        #proof-modal.is-error .proof-modal-spinner {
            display: none;
        }
        .proof-modal-content img {
            display: block;
            max-width: 100%;
            max-height: calc(90vh - 40px);
            border-radius: 8px;
            margin: 0 auto;
            opacity: 1;
            transition: opacity 0.2s ease;
        }
        #proof-modal.is-loading .proof-modal-content img,
        #proof-modal.is-error .proof-modal-content img {
            opacity: 0;
        }
        .proof-modal-close {
            position: absolute;
            right: 6px;
            top: 6px;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 999px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            font-size: 18px;
        }
        @keyframes proof-modal-spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script type="module" src="../assets/js/firebase-setup.js"></script>
    <script src="../assets/js/favorites.js"></script>
    <script src="../assets/js/dropdown.js"></script>
    <script src="../assets/js/profil-page.js"></script>
</body>

</html>
