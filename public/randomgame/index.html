<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chargement d'un jeu aléatoire...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }

        .loading-container {
            text-align: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .game-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 20px;
            max-width: 400px;
        }

        .error {
            background: rgba(255, 100, 100, 0.2);
            border: 1px solid rgba(255, 100, 100, 0.4);
            color: #ffcccc;
        }

        .retry-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .retry-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .retry-countdown {
            font-size: 0.9rem;
            margin-top: 10px;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <div class="loading-text">Recherche d'un jeu aléatoire...</div>
        <div id="game-info" class="game-info" style="display: none;">
            <div id="game-title"></div>
            <div id="game-system"></div>
        </div>
        <div id="error-container" class="game-info error" style="display: none;">
            <div id="error-message"></div>
            <button class="retry-btn" onclick="retryRandomGame()">Réessayer</button>
            <div id="retry-countdown" class="retry-countdown" style="display: none;"></div>
        </div>
    </div>

    <script>
        let gameData = [];
        let currentGame = null;
        let currentGameIndex = 0;
        let isChronologicalOrder = false;
        let retryInterval = null;
        let countdownInterval = null;
        let retryCount = 0;

        async function loadRandomGame() {
            try {
                // Show loading state
                document.getElementById('game-info').style.display = 'none';
                document.getElementById('error-container').style.display = 'none';

                // Check if we're in screensaver mode and read behavior (random/latest/upcoming/featured)
                const screensaverBehavior = sessionStorage.getItem('screensaverBehavior') || 'random';
                isChronologicalOrder = (screensaverBehavior === 'latest');

                // Fetch the game list
                const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname.startsWith('192.168.');
                const cacheBuster = '?v=' + Date.now();
                const gamelistUrl = isLocalhost ? '../gamelist.json' + cacheBuster : 'https://storage.googleapis.com/bonjourarcade/gamelist.json' + cacheBuster;
                const response = await fetch(gamelistUrl);
                if (!response.ok) {
                    throw new Error(`Impossible de charger la liste des jeux (statut : ${response.status})`);
                }

                const data = await response.json();

                // Use all games from the simplified structure
                let allGames = Array.isArray(data.games) ? data.games : [];

                // Determine source based on behavior (used to build filtered lists)
                const screensaverSource = (screensaverBehavior === 'upcoming') ? 'upcoming' : ((screensaverBehavior === 'featured') ? 'featured' : 'all');
                let sourceFilteredGames = null;

                if (screensaverSource === 'upcoming') {
                    try {
                        const upRes = await fetch('/api/upcoming-games.json');
                        if (upRes.ok) {
                            const upcomingList = await upRes.json();
                            const upcomingIds = Array.isArray(upcomingList) ? upcomingList.map(item => item.game_id).filter(Boolean) : [];
                            sourceFilteredGames = upcomingIds.map(id => allGames.find(g => g.id === id)).filter(Boolean);
                        }
                    } catch (e) {
                        console.warn('Could not load upcoming list for screensaver:', e);
                        sourceFilteredGames = null;
                    }
                } else if (screensaverSource === 'featured') {
                    try {
                        const curRes = await fetch('/api/current-game');
                        const prevRes = await fetch('/api/previous-games.json');
                        let ids = [];
                        if (curRes.ok) {
                            const curText = (await curRes.text()).trim();
                            if (curText) ids.push(curText);
                        }
                        if (prevRes.ok) {
                            const prevJson = await prevRes.json();
                            if (Array.isArray(prevJson)) ids = ids.concat(prevJson.map(id => (typeof id === 'string' ? id : (id.game_id || id))));
                        }
                        // Remove duplicates while preserving order
                        const seen = new Set();
                        ids = ids.filter(id => { if (!id || seen.has(id)) return false; seen.add(id); return true; });
                        sourceFilteredGames = ids.map(id => allGames.find(g => g.id === id)).filter(Boolean);
                    } catch (e) {
                        console.warn('Could not load featured list for screensaver:', e);
                        sourceFilteredGames = null;
                    }
                }

                // Check if screensaver should use filtered games (explicit filter) only when no sourceFilteredGames
                const hasFilter = sessionStorage.getItem('screensaverHasFilter') === 'true';
                if (sourceFilteredGames !== null) {
                    gameData = sourceFilteredGames;
                } else if (hasFilter) {
                    const filteredGameIdsJson = sessionStorage.getItem('screensaverFilteredGames');
                    if (filteredGameIdsJson) {
                        try {
                            const filteredGameIds = JSON.parse(filteredGameIdsJson);
                            // Filter games to only include those in the filtered list
                            gameData = allGames.filter(game => filteredGameIds.includes(game.id));
                        } catch (e) {
                            console.error('Error parsing filtered games:', e);
                            // Fallback to all games if parsing fails
                            gameData = allGames;
                        }
                    } else {
                        // No filtered games list, use all games
                        gameData = allGames;
                    }
                } else {
                    // No filter active, use all games
                    gameData = allGames;
                }

                // Filter out games with problems
                gameData = gameData.filter(game => game.problem !== "true");

                if (gameData.length === 0) {
                    throw new Error('Aucun jeu disponible');
                }

                // Decide whether to use sequential looping: latest, upcoming or featured use sequential; random does not
                const screensaverSourceFinal = screensaverSource || 'all';
                const useSequential = (screensaverSourceFinal === 'upcoming' || screensaverSourceFinal === 'featured' || isChronologicalOrder);

                if (useSequential) {
                    // If chronological order specifically requested and we're using the 'all' source, sort by added
                    if (isChronologicalOrder && screensaverSourceFinal === 'all') {
                        gameData.sort((a, b) => {
                            const dateA = new Date(a.added || '1900-01-01');
                            const dateB = new Date(b.added || '1900-01-01');
                            return dateB - dateA; // Newest first
                        });
                    }

                    // Use a per-behavior session key so each mode keeps its own index
                    const indexKey = `currentGameIndex_${screensaverBehavior || 'sequential'}`;
                    currentGameIndex = parseInt(sessionStorage.getItem(indexKey) || '0', 10) || 0;
                    if (currentGameIndex >= gameData.length) currentGameIndex = 0;
                    currentGame = gameData[currentGameIndex];

                    // Increment and wrap, then persist for this behavior
                    currentGameIndex = (currentGameIndex + 1) % Math.max(1, gameData.length);
                    sessionStorage.setItem(indexKey, currentGameIndex.toString());
                } else {
                    const inScreensaver = sessionStorage.getItem('screensaverMode') === 'true';

                    if (inScreensaver) {
                        let unplayedGames = [];
                        try {
                            const stored = sessionStorage.getItem('unplayedRandomGames');
                            if (stored) unplayedGames = JSON.parse(stored);
                        } catch (e) { }

                        const validGameIds = new Set(gameData.map(g => g.id));
                        unplayedGames = unplayedGames.filter(id => validGameIds.has(id));

                        if (unplayedGames.length === 0) {
                            unplayedGames = gameData.map(g => g.id);
                        }

                        const randIdx = Math.floor(Math.random() * unplayedGames.length);
                        const selectedId = unplayedGames[randIdx];
                        currentGame = gameData.find(g => g.id === selectedId) || gameData[Math.floor(Math.random() * gameData.length)];

                        unplayedGames.splice(randIdx, 1);
                        sessionStorage.setItem('unplayedRandomGames', JSON.stringify(unplayedGames));
                    } else {
                        // Select a random game (original behavior)
                        const randomIndex = Math.floor(Math.random() * gameData.length);
                        currentGame = gameData[randomIndex];
                    }
                }

                // Show game info briefly
                document.getElementById('game-title').textContent = currentGame.title || 'Jeu inconnu';

                // Map core to system name
                const systemMap = {
                    'arcade': 'Arcade',
                    'mame2003_plus': 'Arcade (MAME)',
                    'atari2600': 'Atari 2600',
                    'gb': 'Game Boy',
                    'gba': 'Game Boy Advance',
                    'segaMD': 'Sega Genesis/Mega Drive',
                    'nds': 'Nintendo DS',
                    'segaGG': 'Sega Game Gear',
                    'jaguar': 'Atari Jaguar',
                    'lynx': 'Atari Lynx',
                    'n64': 'Nintendo 64',
                    'nes': 'Nintendo Entertainment System',
                    'pce': 'PC Engine/TurboGrafx-16',
                    'psx': 'PlayStation',
                    'segaSaturn': 'Sega Saturn',
                    'sega32x': 'Sega 32X',
                    'segaMS': 'Sega Master System',
                    'snes': 'Super Nintendo',
                    'vb': 'Virtual Boy',
                    'ws': 'WonderSwan'
                };
                const systemName = currentGame.core ? (systemMap[currentGame.core] || currentGame.core) : 'Système inconnu';
                document.getElementById('game-system').textContent = systemName;
                document.getElementById('game-info').style.display = 'block';

                // Wait a moment to show the game info, then redirect
                setTimeout(() => {
                    redirectToGame();
                }, 1500);

            } catch (error) {
                console.error('Error loading random game:', error);
                document.getElementById('error-message').textContent = `Erreur : ${error.message}`;
                document.getElementById('error-container').style.display = 'block';

                // Start automatic retry mechanism
                startRetryMechanism();
            }
        }

        function redirectToGame() {
            if (currentGame && currentGame.id) {
                // Stop retry mechanism before successful redirect
                stopRetryMechanism();

                // Set screensaver mode flag if coming from screensaver
                if (sessionStorage.getItem('screensaverMode') === 'true') {
                    sessionStorage.setItem('screensaverMode', 'true');
                    sessionStorage.setItem('lastRandomGame', currentGame.id);
                    sessionStorage.setItem('screensaverStartTime', Date.now().toString());
                }

                // Redirect to the play page with the random game
                window.location.href = `/play/?game=${currentGame.id}`;
            } else {
                throw new Error('Données de jeu invalides');
            }
        }

        function startRetryMechanism() {
            // Clear any existing intervals
            if (retryInterval) {
                clearInterval(retryInterval);
            }
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }

            // Reset retry count
            retryCount = 0;

            // Show countdown element
            const countdownElement = document.getElementById('retry-countdown');
            countdownElement.style.display = 'block';

            // Start countdown timer
            let countdownSeconds = 60;
            countdownInterval = setInterval(() => {
                countdownElement.textContent = `Nouvel essai dans ${countdownSeconds} secondes...`;
                countdownSeconds--;

                if (countdownSeconds < 0) {
                    clearInterval(countdownInterval);
                    countdownElement.style.display = 'none';
                }
            }, 1000);

            // Start retrying every minute (60,000 milliseconds) - infinite retries
            retryInterval = setInterval(() => {
                retryCount++;
                console.log(`Retrying random game launch (attempt ${retryCount})`);

                // Update error message to show retry status
                const errorMessage = document.getElementById('error-message');
                const originalError = errorMessage.textContent.replace(/ \(Nouvel essai \d+\)/, '');
                errorMessage.textContent = `${originalError} (Nouvel essai ${retryCount})`;

                // Try to load a random game again
                loadRandomGame();
            }, 60000); // 60 seconds = 60,000 milliseconds
        }

        function stopRetryMechanism() {
            if (retryInterval) {
                clearInterval(retryInterval);
                retryInterval = null;
            }
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            retryCount = 0;

            // Hide countdown element
            const countdownElement = document.getElementById('retry-countdown');
            countdownElement.style.display = 'none';

            console.log('Retry mechanism stopped');
        }

        function retryRandomGame() {
            // Stop automatic retries when user manually retries
            stopRetryMechanism();

            // Reset game index for chronological order if needed
            if (isChronologicalOrder) {
                sessionStorage.removeItem('currentGameIndex');
            }
            loadRandomGame();
        }

        // Start loading when page loads
        document.addEventListener('DOMContentLoaded', loadRandomGame);

        // Cleanup retry mechanism when page is unloaded
        window.addEventListener('beforeunload', function () {
            stopRetryMechanism();
        });
    </script>
</body>

</html>
