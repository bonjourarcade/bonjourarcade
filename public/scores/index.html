<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scores - BonjourArcade</title>
    <meta name="description" content="Les meilleurs scores soumis par la communauté BonjourArcade.">
    <link rel="icon" href="../favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0e0e0e;
            color: #eee;
            min-height: 100vh;
        }

        header {
            background: #111;
            border-bottom: 2px solid #222;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        header a.logo {
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            color: #ffd700;
            text-decoration: none;
        }

        header nav a {
            color: #aaa;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
            transition: color 0.2s;
        }

        header nav a:hover {
            color: #fff;
        }

        .page-hero {
            text-align: center;
            padding: 48px 24px 32px;
        }

        .page-hero h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(16px, 4vw, 28px);
            color: #ffd700;
            margin-bottom: 12px;
        }

        .page-hero p {
            color: #888;
            font-size: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 0 24px 28px;
            flex-wrap: wrap;
        }

        .controls select {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #eee;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .controls button {
            background: #ffd700;
            color: #111;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .controls button:hover {
            opacity: 0.85;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 0 24px 48px;
            max-width: 1280px;
            margin: 0 auto;
        }

        .score-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .score-card:hover {
            transform: translateY(-3px);
            border-color: #ffd700;
        }

        .card-screenshot {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            background: #111;
            display: block;
        }

        .card-screenshot-placeholder {
            width: 100%;
            aspect-ratio: 4/3;
            background: linear-gradient(135deg, #111, #1e1e1e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #333;
        }

        .card-body {
            padding: 14px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card-game {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-game a {
            color: #aaa;
            text-decoration: none;
        }

        .card-game a:hover {
            color: #ffd700;
        }

        .card-score {
            font-family: 'Press Start 2P', monospace;
            font-size: 18px;
            color: #ffd700;
        }

        .card-rank {
            font-size: 11px;
            color: #666;
        }

        .card-player {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }

        .card-player img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }

        .card-player-name {
            font-size: 13px;
            color: #ccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-comment {
            font-size: 12px;
            color: #777;
            font-style: italic;
            margin-top: 4px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card-date {
            font-size: 11px;
            color: #555;
            margin-top: auto;
            padding-top: 8px;
        }

        .loading,
        .empty {
            text-align: center;
            padding: 64px 24px;
            color: #555;
            font-size: 15px;
        }

        .loading .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #333;
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 12px 16px;
            }

            .gallery {
                grid-template-columns: 1fr;
                padding: 0 16px 32px;
            }

            header nav a:first-child {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <header>
        <a class="logo" href="/">BONJOUR ARCADE</a>
        <nav>
            <a href="/">Accueil</a>
            <a href="/all/">Jeux</a>
            <a href="/scores/">Scores</a>
        </nav>
    </header>

    <div class="page-hero">
        <h1>🏆 Hall of Fame</h1>
        <p>Les meilleurs scores soumis et validés par la communauté.</p>
    </div>

    <div class="controls">
        <select id="game-filter">
            <option value="all">Tous les jeux</option>
        </select>
        <button id="refresh-btn">Actualiser</button>
    </div>

    <div id="scores-gallery" class="gallery">
        <div class="loading" style="grid-column:1/-1;">
            <div class="spinner"></div>
            Chargement des scores…
        </div>
    </div>

    <script type="module" src="../assets/js/firebase-setup.js"></script>
    <script>
        const gallery = document.getElementById('scores-gallery');
        const gameFilter = document.getElementById('game-filter');
        const refreshBtn = document.getElementById('refresh-btn');

        let allScores = [];

        function formatDate(ts) {
            if (!ts) return '';
            // Firestore timestamps come back as { _seconds, _nanoseconds } from callable
            const ms = ts._seconds ? ts._seconds * 1000 : new Date(ts).getTime();
            return new Date(ms).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function renderScores(scores) {
            if (!scores || scores.length === 0) {
                gallery.innerHTML = '<div class="empty" style="grid-column:1/-1;">Aucun score à afficher pour le moment.</div>';
                return;
            }

            gallery.innerHTML = scores.map(s => {
                const gameTitle = s.game?.title || s.game?.id || s.gameId || '?';
                const gameId = s.game?.id || s.gameId || '';
                const playerName = s.player?.username || s.player || 'Joueur anonyme';
                const score = s.value ?? s.score ?? '?';
                const date = formatDate(s.createdAt);
                const screenshot = s.screenshotUrl;
                const comment = s.comment || '';
                const rank = s.rank;

                const screenshotHtml = screenshot
                    ? `<img class="card-screenshot" src="${screenshot}" alt="Screenshot de ${gameTitle}" loading="lazy">`
                    : `<div class="card-screenshot-placeholder">🕹️</div>`;

                const rankHtml = rank ? `<div class="card-rank"># ${rank} sur ce jeu</div>` : '';
                const commentHtml = comment ? `<div class="card-comment">"${comment}"</div>` : '';

                return `
                    <div class="score-card">
                        ${screenshotHtml}
                        <div class="card-body">
                            <div class="card-game">
                                <a href="/b/${gameId}">${gameTitle}</a>
                            </div>
                            <div class="card-score">${Number(score).toLocaleString('fr-FR')}</div>
                            ${rankHtml}
                            <div class="card-player">
                                <span class="card-player-name">👤 ${playerName}</span>
                            </div>
                            ${commentHtml}
                            <div class="card-date">${date}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function loadScores() {
            gallery.innerHTML = '<div class="loading" style="grid-column:1/-1;"><div class="spinner"></div>Chargement…</div>';
            try {
                // Wait for firebase-setup.js to initialise (it's a module)
                await new Promise(r => setTimeout(r, 300));

                const selectedGame = gameFilter.value;
                let result;

                if (selectedGame === 'all') {
                    result = await window.getLatestScores();
                    allScores = result?.scores || [];
                } else {
                    result = await window.listGameScores(selectedGame);
                    allScores = result?.scores || [];
                }

                // Populate game filter from loaded scores if on 'all'
                if (selectedGame === 'all' && allScores.length > 0) {
                    const seenGames = new Map();
                    allScores.forEach(s => {
                        const id = s.game?.id || s.gameId;
                        const title = s.game?.title || id;
                        if (id && !seenGames.has(id)) seenGames.set(id, title);
                    });
                    // Rebuild options preserving selection
                    const current = gameFilter.value;
                    gameFilter.innerHTML = '<option value="all">Tous les jeux</option>';
                    seenGames.forEach((title, id) => {
                        const opt = document.createElement('option');
                        opt.value = id;
                        opt.textContent = title;
                        gameFilter.appendChild(opt);
                    });
                    gameFilter.value = current;
                }

                renderScores(allScores);
            } catch (err) {
                console.error(err);
                gallery.innerHTML = `<div class="empty" style="grid-column:1/-1;">Erreur de chargement : ${err.message}</div>`;
            }
        }

        gameFilter.addEventListener('change', loadScores);
        refreshBtn.addEventListener('click', loadScores);

        // Load on init — wait a moment for firebase module to parse
        window.addEventListener('load', () => setTimeout(loadScores, 400));
    </script>
</body>

</html>
