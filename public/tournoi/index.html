<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournoi BonjourArcade</title>
    <style>
        body { background: #0a0a0f; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #1a1a2e; border-radius: 16px; padding: 40px; max-width: 480px; width: 90%; border: 1px solid #2a2a4a; text-align: center; }
        h1 { color: #ffd700; font-size: 1.6rem; margin: 0 0 8px; }
        p { color: #aaa; margin: 8px 0 24px; line-height: 1.5; }
        .links { display: flex; flex-direction: column; gap: 12px; }
        .links a { display: block; padding: 14px 24px; border-radius: 10px; text-decoration: none; font-weight: 600; transition: all 0.2s; }
        .links a.primary { background: #ffd700; color: #1a1a2e; }
        .links a.primary:hover { background: #ffe44d; }
        .links a.secondary { background: #2a2a4a; color: #e0e0e0; }
        .links a.secondary:hover { background: #3a3a5a; }
        .small { font-size: 0.85rem; color: #666; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎮 Tournois BonjourArcade</h1>
        <p>Bienvenue sur la plateforme de tournois. Connecte-toi comme admin pour organiser ou rejoins un tournoi existant avec un code.</p>
        <div class="links">
            <a href="host/" class="primary">🎬 Organiser un tournoi (Admin)</a>
            <a href="join/" class="secondary">🔗 Rejoindre avec un code</a>
        </div>
        <div class="small">Le code de partage t'est fourni par l'organisateur du tournoi.</div>
    </div>
</body>
</html>
