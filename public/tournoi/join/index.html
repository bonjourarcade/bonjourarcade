<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rejoindre un tournoi - BonjourArcade</title>
  <link rel="icon" href="../../assets/favicon.ico" type="image/x-icon">
  <style>
    body { background: #0a0a0f; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
    .card { background: #1a1a2e; border-radius: 16px; padding: 40px; max-width: 420px; width: 90%; border: 1px solid #2a2a4a; text-align: center; }
    h1 { color: #ffd700; font-size: 1.4rem; margin: 0 0 8px; }
    p { color: #aaa; margin: 8px 0 16px; }
    button { padding: 12px 32px; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: 600; transition: all 0.2s; width: 100%; }
    .btn-primary { background: #ffd700; color: #1a1a2e; }
    .btn-primary:hover { background: #ffe44d; }
    .btn-google { background: white; color: #333; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 24px; }
    .btn-google:hover { background: #f0f0f0; }
    .hidden { display: none !important; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #ffd700; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .info-line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2a2a4a; font-size: 0.9rem; }
    .info-line .label { color: #888; }
    .info-line .value { color: #e0e0e0; font-weight: 600; }
    .error { color: #dc3545; margin-top: 8px; font-size: 0.9rem; }
    .success { color: #28a745; margin-top: 8px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <div id="loading-state">
      <div class="spinner"></div>
      <p style="margin-top:12px;">Recherche du tournoi...</p>
    </div>

    <div id="login-state" class="hidden">
      <h1>🔑 Connexion</h1>
      <p>Connecte-toi avec Google pour rejoindre le tournoi.</p>
      <button id="login-btn" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.28-3.14.76-4.59l-7.98-6.19A23.99 23.99 0 0 0 0 24c0 3.77.87 7.35 2.56 10.56l7.97-5.97z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 5.97C6.51 42.62 14.62 48 24 48z"/></svg>
        Connexion avec Google
      </button>
      <div id="login-error" class="error hidden"></div>
    </div>

    <div id="code-input-state" class="hidden">
      <h1>🔗 Entrer un code</h1>
      <p>Entre le code de partage fourni par l'organisateur.</p>
      <input type="text" id="code-input" placeholder="Ex: AB3X9K" style="width:100%;padding:12px;margin:12px 0;background:#12121f;border:1px solid #333;border-radius:8px;color:#e0e0e0;font-size:1.1rem;text-align:center;text-transform:uppercase;letter-spacing:4px;font-family:monospace;box-sizing:border-box;">
      <button id="lookup-code-btn" class="btn-primary">Chercher le tournoi</button>
      <div id="code-input-error" class="error hidden"></div>
    </div>

    <div id="join-state" class="hidden">
      <h1>🎮 <span id="tournament-name">Tournoi</span></h1>
      <div id="tournament-info"></div>
      <button id="join-btn" class="btn-primary" style="margin-top:16px;">Rejoindre le tournoi</button>
      <div id="join-error" class="error hidden"></div>
      <div id="join-success" class="success hidden"></div>
    </div>

    <div id="redirect-state" class="hidden">
      <h1>✅ Inscrit !</h1>
      <p>Tu es inscrit au tournoi. Redirection...</p>
      <div class="spinner"></div>
    </div>

    <div id="error-state" class="hidden">
      <h1>😕</h1>
      <p id="error-message" class="error">Tournoi introuvable.</p>
    </div>
  </div>

  <script type="module" src="../../assets/js/firebase-setup.js"></script>
  <script type="module" src="tournament-join.js"></script>
</body>
</html>
