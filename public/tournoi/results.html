<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résultats du Tournoi - Bonjour Arcade</title>
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../assets/css/style.css"> <!-- Existing global styles -->
    <link rel="stylesheet" href="results.css">
</head>
<body>
    <a href="/" style="position:fixed;top:16px;left:16px;font-size:0.85rem;cursor:pointer;padding:8px 12px;border-radius:8px;z-index:100;text-decoration:none;background:rgba(0,0,0,0.6);color:#fff;border:1px solid rgba(255,255,255,0.2);font-weight:600;">🏠 Accueil</a>
    <button id="results-theme-btn" style="position:fixed;top:16px;right:16px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.2);font-size:1.2rem;cursor:pointer;padding:6px 10px;border-radius:8px;color:#fff;z-index:100;">🌙</button>
    <div id="results-container">
        <!-- Section 1: Intro - "Résultats" -->
        <section id="intro-section" class="results-section black-bg">
            <h1 class="centered-text fade-in">Résultats</h1>
            <img id="drumroll-gif" src="../assets/drumroll.gif" alt="Drum roll animation">
        </section>

        <!-- Section 2: 3rd Place (Bronze) -->
        <section id="bronze-section" class="results-section bronze-bg">
            <h2 class="podium-rank">3ème Place</h2>
            <div id="bronze-player" class="player-display"></div>
        </section>

        <!-- Section 3: 2nd Place (Silver) -->
        <section id="silver-section" class="results-section silver-bg">
            <h2 class="podium-rank">2ème Place</h2>
            <div id="silver-player" class="player-display"></div>
        </section>

        <!-- Section 4: 1st Place (Gold) -->
        <section id="gold-section" class="results-section gold-bg">
            <h2 class="podium-rank">1ère Place</h2>
            <div id="gold-player" class="player-display"></div>
        </section>

        <!-- Section 5: Cumulative Scores Table & Overall Champion -->
        <section id="cumulative-section" class="results-section textured-bg">
            <h2 class="section-title">Scores Cumulatifs</h2> <!-- Changed title -->
            <div id="cumulative-table-container">
                <table class="cumulative-scores-table">
                    <thead>
                        <tr>
                            <th>Rang</th>
                            <th>Joueur</th>
                            <th>Total %</th>
                        </tr>
                    </thead>
                    <tbody id="cumulative-scores-tbody">
                        <!-- Cumulative scores will be inserted here by JS -->
                    </tbody>
                </table>
            </div>
            <h3 class="section-subtitle">Champion Cumulatif</h3> <!-- New title for winner -->
            <div id="overall-champion-display" class="overall-champion-display"></div>
        </section>

        <!-- Section 6: Round Summaries -->
        <section id="round-summaries-section" class="results-section light-bg">
            <h2 class="section-title">Revoir les rondes</h2>
            <div id="round-summaries-container" class="round-summaries-container">
                <!-- Round summary tables will be inserted here by JS -->
            </div>
        </section>

        <!-- Section 7: End Tournament -->
        <section id="end-tournament-section" class="results-section black-bg">
            <button id="end-tournament-btn" class="end-tournament-button">Terminer le Tournoi</button>
        </section>
    </div>

    <script src="results.js"></script>
    <script>
        function applyTheme(theme) {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const effective = theme === 'system' ? (prefersDark ? 'dark' : 'light') : theme;
            document.body.classList.toggle('theme-light', effective === 'light');
            const btn = document.getElementById('results-theme-btn');
            if (btn) btn.textContent = effective === 'dark' ? '🌙' : '☀️';
        }
        const saved = localStorage.getItem('theme') || 'system';
        applyTheme(saved);
        document.getElementById('results-theme-btn').addEventListener('click', () => {
            const current = localStorage.getItem('theme') || 'system';
            const next = current === 'dark' ? 'light' : (current === 'light' ? 'system' : 'dark');
            localStorage.setItem('theme', next);
            applyTheme(next);
        });
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            const theme = localStorage.getItem('theme') || 'system';
            if (theme === 'system') applyTheme('system');
        });
    </script>
</body>
</html>
