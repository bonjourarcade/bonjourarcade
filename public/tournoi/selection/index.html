<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sélection Tournoi – BonjourArcade</title>
    <link rel="icon" href="../../favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0f;
            --surface: #18181c;
            --surface2: #22222a;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #ffd700;
            --accent2: #ff6b35;
            --text: #f0f0f5;
            --muted: #888898;
            --radius: 14px;
            --accent-text: #ffd700;
            --accent-bg: transparent;
            --accent-pad: 0;
            --accent-radius: 0;
        }

        body.theme-light {
            --bg: #f5f5f7;
            --surface: #ffffff;
            --surface2: #eeeeee;
            --border: rgba(0, 0, 0, 0.12);
            --text: #1d1d1f;
            --muted: #6e6e7a;
            --accent-text: #1d1d1f;
            --accent-bg: rgba(255, 215, 0, 0.55);
            --accent-pad: 1px 6px;
            --accent-radius: 4px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 16px;
            flex-wrap: wrap;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text);
        }

        .header-brand img {
            height: 32px;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-text);
            background: var(--accent-bg);
            padding: var(--accent-pad);
            border-radius: var(--accent-radius);
            letter-spacing: 0.5px;
        }

        body.theme-light header h1 {
            display: inline-block;
        }

        .header-meta {
            font-size: 0.85rem;
            color: var(--muted);
            text-align: right;
        }

        /* --- Main content --- */
        main {
            flex: 1;
            padding: 18px 20px 28px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- Error / Loading state --- */
        #state-msg {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            font-size: 1rem;
            display: none;
        }

        #state-msg.visible {
            display: block;
        }

        /* --- Game Grid --- */
        #game-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .game-card {
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text);
            transition: background 0.18s, border-color 0.18s, transform 0.15s, box-shadow 0.15s;
            overflow: hidden;
            min-height: 100%;
        }

        .game-card:hover {
            background: var(--surface2);
            border-color: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.42);
        }

        .game-cover-wrap {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            overflow: hidden;
            margin-bottom: 10px;
            min-height: 180px;
            max-height: 30vh;
        }

        .game-cover {
            width: auto;
            height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .game-info {
            width: 100%;
            text-align: center;
        }

        .game-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .game-meta {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .game-description {
            margin-top: 10px;
            font-size: 0.95rem;
            line-height: 1.45;
            color: var(--text);
            text-align: left;
        }

        @media (max-width: 720px) {
            #game-list {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }

        @media (max-width: 480px) {
            .game-title {
                font-size: 1.15rem;
            }

            .game-meta {
                font-size: 0.85rem;
            }

            .game-cover-wrap {
                min-height: 160px;
                max-height: 26vh;
            }

            header {
                padding: 12px 16px;
            }

            main {
                padding: 14px 12px 24px;
            }
        }
    </style>
</head>

<body>
    <header>
        <a class="header-brand" href="/">
            <img src="../../assets/images/bonjourarcade-logo.png" alt="BonjourArcade"
                onerror="this.style.display='none'">
            <h1>🏆 Sélection Tournoi</h1>
        </a>
        <div style="display:flex;align-items:center;gap:12px;">
            <div class="header-meta" id="header-meta"></div>
            <button class="theme-btn" id="theme-btn" title="Changer le thème"
                style="background:none;border:1px solid var(--border);font-size:1.1rem;cursor:pointer;padding:4px 8px;border-radius:8px;color:var(--text);">🌙</button>
        </div>
    </header>

    <main>
        <div id="state-msg">Chargement des jeux…</div>
        <div id="game-list"></div>
    </main>

    <script>
        let games = []; // [{id, title, coverArt, year, genre, announcementMessage, pageUrl}]

        // ----------- URL parsing -----------
        function getGameIdsFromUrl() {
            const params = new URLSearchParams(window.location.search);
            // Support ?games=id1,id2,id3  OR  ?g=id1&g=id2&g=id3
            if (params.has('games')) {
                return params.get('games').split(',').map(s => s.trim()).filter(Boolean);
            }
            return params.getAll('g').map(s => s.trim()).filter(Boolean);
        }

        // ----------- Game data -----------
        async function fetchGameData(ids) {
            const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname.startsWith('192.168.');
            const cacheBuster = '?v=' + Date.now();
            const url = isLocalhost
                ? '../../gamelist.json' + cacheBuster
                : 'https://storage.googleapis.com/bonjourarcade/gamelist.json' + cacheBuster;

            const resp = await fetch(url);
            if (!resp.ok) throw new Error('Impossible de charger gamelist.json');
            const data = await resp.json();

            const byId = {};
            for (const g of data.games || []) byId[g.id] = g;

            return ids.map((id) => {
                const g = byId[id];
                if (!g) return { id, title: id, coverArt: null, year: '', genre: '', announcementMessage: '', pageUrl: `/play/?game=${id}` };
                return {
                    id: g.id,
                    title: g.title || id,
                    coverArt: g.coverArt || null,
                    year: g.year || '',
                    genre: g.genre || '',
                    announcementMessage: g.announcement_message || '',
                    pageUrl: `/play/?game=${g.id}`,
                };
            }).sort((a, b) => a.title.localeCompare(b.title, 'fr', { sensitivity: 'base' }));
        }

        // ----------- Render -----------
        function renderList() {
            const list = document.getElementById('game-list');
            list.innerHTML = '';

            const total = games.length;

            document.getElementById('header-meta').textContent = `${total} jeu${total !== 1 ? 'x' : ''} dans ce tournoi`;

            games.forEach((g) => {
                const card = document.createElement('a');
                card.className = 'game-card';
                card.href = g.pageUrl;
                card.target = '_blank';
                card.rel = 'noopener';

                card.innerHTML += `
                    <div class="game-cover-wrap">
                        <img class="game-cover" src="${g.coverArt || ''}" alt="${g.title}"
                             onerror="this.style.opacity='0'">
                    </div>
                    <div class="game-info">
                        <div class="game-title">${g.title}</div>
                        <div class="game-meta">${[g.year, g.genre].filter(Boolean).join(' · ')}</div>
                    </div>
                `;

                if (g.announcementMessage && g.announcementMessage.trim()) {
                    const description = document.createElement('div');
                    description.className = 'game-description';
                    description.textContent = g.announcementMessage.trim();
                    card.appendChild(description);
                }

                list.appendChild(card);
            });
        }

        // ----------- Init -----------
        async function init() {
            const stateMsg = document.getElementById('state-msg');
            stateMsg.classList.add('visible');
            stateMsg.textContent = 'Chargement des jeux…';

            const ids = getGameIdsFromUrl();

            if (ids.length === 0) {
                stateMsg.innerHTML = `
                    <p style="font-size:1.5rem; margin-bottom:16px;">⚠️ Aucun jeu spécifié</p>
                    <p>Ajoute des IDs de jeu dans l'URL, par exemple&nbsp;:</p>
                    <code style="background:#1e1e24; padding:10px 18px; border-radius:8px; font-size:0.9rem; display:inline-block; margin-top:12px; color:#ffd700;">
                        /tournoi/selection/?games=1943,outrun,tetris
                    </code>
                `;
                return;
            }

            try {
                games = await fetchGameData(ids);
                stateMsg.classList.remove('visible');
                renderList();
            } catch (e) {
                stateMsg.textContent = `Erreur : ${e.message}`;
            }
        }

        init();

        function applyTheme(theme) {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const effective = theme === 'system' ? (prefersDark ? 'dark' : 'light') : theme;
            document.body.classList.toggle('theme-light', effective === 'light');
            document.getElementById('theme-btn').textContent = effective === 'dark' ? '🌙' : '☀️';
        }
        const saved = localStorage.getItem('theme') || 'system';
        applyTheme(saved);
        document.getElementById('theme-btn').addEventListener('click', () => {
            const current = localStorage.getItem('theme') || 'system';
            const next = current === 'dark' ? 'light' : (current === 'light' ? 'system' : 'dark');
            localStorage.setItem('theme', next);
            applyTheme(next);
        });
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            const theme = localStorage.getItem('theme') || 'system';
            if (theme === 'system') applyTheme('system');
        });
    </script>
</body>

</html>
